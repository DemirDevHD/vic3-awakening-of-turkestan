 yettishar_events.110.t:0 "Alim Kul Ulemanın Başında"
 yettishar_events.110.d:0 "Alim Kul Muhammed dindarlar arasında yükselir. Cihatçı bir ulema sesi olarak Devout liderliğini alır ve general olarak hizmete hazırdır."
 yettishar_events.110.f:0 "'İmanın kılıcı ile âlimlerin sözü birdir.'"
 yettishar_events.110.a:0 "Alim Kul ulemayı yönetsin."
 yettishar_events.111.t:0 "Veliaht Babıali'ye Yola Çıkıyor"
 yettishar_events.111.d:0 "Beg Kuli Beg İstanbul'a doğru yola çıkar. Saray masrafları ve Babıali hediyeleri hazineyi zorlar; Silahlı Kuvvetler homurdanırken Aydınlar bu jesti alkışlar."
 yettishar_events.111.f:0 "Dersaadet yolu uzundur, ama sonunda bilgi bekler."
 yettishar_events.111.a:0 "Allah veliahtı yolculuğunda korusun."
 yettishar_events.112.t:0 "Veliaht Babıali'den Dönüyor"
 yettishar_events.112.d:0 "İstanbul'da iki yılın ardından Beg Kuli Beg dönüşmüş olarak gelir — öğrenim, diplomasi ve modern fikirlerle dolu bir reformcu; yine de cesur ve hırslı."
 yettishar_events.112.f:0 "'Boğaz'dan Haliç'e bir devletin nasıl yönetildiğini gördüm.'"
 yettishar_events.112.a:0 "Hoş geldin, Beg Kuli Beg."
 yettishar_events.120.t:0 "Babıali Askeri Heyeti Geldi"
 yettishar_events.120.d:0 "Babıali'nin gönderdiği zabitler kurmayımızı eğitmeye ve modern harp bilgisini aktarmaya başlar. Varlıkları bir kuşak boyunca araştırmamıza yön verecektir."
 yettishar_events.120.f:0 "Dersaadet'ten Kaşgar'a aynı reform davulları çalar."
 yettishar_events.120.a:0 "Heyeti şerefle kabul edelim."
 yettishar_events.121.t:0 "Mekteb-i Harbiye Açılıyor"
 yettishar_events.121.d:0 "Başkentte yeni bir harp mektebi yükselir. Talebeler kurmaylık, lojistik ve modern silahları öğrenecek — devletimizin ilk ciddi askeri akademisi."
 yettishar_events.121.f:0 "Bir zamanlar yalnızca kabile bilgisi varken, artık harp ilimleri okutulur."
 yettishar_events.121.a:0 "Mekteb-i Harbiye'yi açalım."
 yettishar_events.122.t:0 "Londra Askeri Danışmanlığı"
 yettishar_events.122.d:0 "İngiliz danışmanlar bilgi aktarmayı teklif eder. İngiltere'nin sahip olduğu, bizde olmayan bir teknolojiyi seçin veya yalnızca askeri araştırmayı hızlandırmaya odaklanın."
 yettishar_events.122.f:0 "Büyük Oyun yalnızca tüfek değil — doktrin de sunar."
 yettishar_events.122.a:0 "Yivli tüfek (Rifling) bilgisini alalım."
 yettishar_events.122.b:0 "Kurmay Sınıfı (General Staff) düzenini alalım."
 yettishar_events.122.c:0 "Siper İşleri (Field Works) teknolojisini alalım."
 yettishar_events.122.g:0 "Lojistik (Logistics) teknolojisini alalım."
 yettishar_events.122.e:0 "Pervaneli fırkateyn (Screw Frigate) tasarımlarını alalım."
 yettishar_events.122.h:0 "Bunun yerine askeri araştırma hızına odaklanalım."
