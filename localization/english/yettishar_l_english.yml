# Crisis Events
  kashgar_diplomacy_events.1.t:0 "Requesting the Caliph's Support"
  kashgar_diplomacy_events.1.d:0 "Our envoys have arrived in Istanbul."
  kashgar_diplomacy_events.1.a:0 "Let us await the news."
  kashgar_diplomacy_events.2.t:0 "Envoy to London"
  kashgar_diplomacy_events.2.d:0 "We seek support in exchange for commercial privileges."
  kashgar_diplomacy_events.2.a:0 "We hope the queen listens."
  kashgar_diplomacy_events.3.t:0 "St. Petersburg Diplomacy"
  kashgar_diplomacy_events.3.d:0 "We are discussing the future of Central Asia with the Tsar."
  kashgar_diplomacy_events.3.a:0 "The borders will be safe."
  kashgar_diplomacy_events.4.t:0 "Ultimatum Delivered to the Qing Empire"
  kashgar_diplomacy_events.4.d:0 "Our diplomatic preparations are complete. An ultimatum has been delivered to Peking demanding the cession of East Turkestan and full recognition of independence."
  kashgar_diplomacy_events.4.a:0 "Awaiting their response."
  kashgar_diplomacy_events.5.t:0 "Independence Ultimatum from Kashgar"
  kashgar_diplomacy_events.5.d:0 "The Yettishar rebels, backed by Great Powers, have sent an ultimatum demanding the evacuation of East Turkestan and recognition of independence!"
  kashgar_diplomacy_events.5.a:0 "We cannot risk this war; cede the requested provinces."
  kashgar_diplomacy_events.5.b:0 "We shall crush these insolent rebels! Let war begin!"
  kashgar_diplomacy_events.6.t:0 "Qing Accepts the Ultimatum!"
  kashgar_diplomacy_events.6.d:0 "The Peking court has bowed before our resolve. Tianshan, Dzungaria, Kirghizia, and Jetisyu provinces have been transferred to us without shedding blood!"
  kashgar_diplomacy_events.6.a:0 "A glorious diplomatic triumph!"
  kashgar_diplomacy_events.7.t:0 "Qing Refuses Ultimatum: War Begins!"
  kashgar_diplomacy_events.7.d:0 "The Peking court rejected our ultimatum and mobilized its armies. The fate of East Turkestan will now be decided on the battlefield!"
