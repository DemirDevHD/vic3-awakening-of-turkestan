 je_cedidism:0 "Cedidcilik ve Milli Uyanış"

 je_cedidism_reason:0 "1880'lerden itibaren Cedidci modern mektep ve toplumsal reform fikirleri Türk aydınları arasında yayılır. İsmail Gaspıralı'yı davet edip programını uygulamak toplumumuzu yeniden şekillendirebilir."

 je_cedidism_status:0 "Gaspıralı'yı davet edin, mektepleri genişletin, kölelik ve serfliği kaldırın, okuryazarlığı artırın ve Cedidci reformun hukuki temellerini güvenceye alın."

