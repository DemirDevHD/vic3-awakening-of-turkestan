  yettishar_events.101.d:0 "With the Khanate of Khiva no longer existing, the esteemed scholar and printer Kamil Khwarezmi has been invited to Kashgar. With the printing expertise and progressive ideals he brings, he is ready to lead the Intelligentsia and ignite reform."
