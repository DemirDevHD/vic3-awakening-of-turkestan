# Günlükler
  kashgar_victory_events.1.t:0 "Bağımsız Kaşgar Devleti'nin Kuruluşu"
  kashgar_victory_events.1.d:0 "Çin İmparatorluğu'na karşı verilen şanlı mücadele zaferle taçlandı! Doğu Türkistan topraklarında bağımsız Kaşgar Hanlığı resmen ilan edildi."
  kashgar_victory_events.1.f:0 "Asırlar süren esaret sona erdi, Türkistan güneşi yeniden doğuyor!"
  kashgar_victory_events.1.a:0 "Yaşasın Kaşgar Hanlığı!"
  dp_yts_liberation:0 "Doğu Türkistan'ın Kurtuluşu"
  yts_liberation:0 "Doğu Türkistan Kurtuluşu"
  yts_liberation_desc:0 "Çin işgalindeki eyaletlerin devrini ve bağımsızlığın tanınmasını sağlar."
  YTS:0 "Yedişehir"
  YTS_ADJ:0 "Yedişehir"
  kashgar_diplomacy_events.3.a:0 "Kuzey rüzgarlarını arkamıza alalım."
  kashgar_diplomacy_events.4.t:0 "Çin İmparatorluğu'na Ültimatom Verildi"
  kashgar_diplomacy_events.4.d:0 "Diplomatik hazırlıklarımız tamamlandı. Pekin'e gönderilen ültimatomda Doğu Türkistan eyaletlerinin devredilmesi ve bağımsızlığımızın tanınması talep edildi."
  kashgar_diplomacy_events.4.a:0 "Haber bekliyoruz."
  kashgar_diplomacy_events.5.t:0 "Kaşgar'dan Gelen Bağımsızlık Ültimatomu"
  kashgar_diplomacy_events.11.f:0 "Halife'nin manevi ve siyasi sancağı Asya bozkırlarında yankılanıyor..."
  kashgar_diplomacy_events.5.d:0 "Yedişehir asileri ve arkalarındaki güçler, Doğu Türkistan eyaletlerinin terk edilmesini ve bağımsızlığın tanınmasını talep eden bir ültimatom gönderdi!"
  kashgar_diplomacy_events.5.a:0 "Bu savaşı göze alamayız, talep edilen eyaletleri bırakın."
  kashgar_diplomacy_events.5.b:0 "Küstah asileri ordularımızla ezeceğiz! Savaş başlasın!"
  kashgar_diplomacy_events.6.t:0 "Çin Ültimatomu Kabul Etti!"
  kashgar_diplomacy_events.6.d:0 "Pekin sarayı boyun eğdi. Doğu Türkistan eyaletleri savaşsız bir şekilde tarafımıza devredildi!"
  kashgar_diplomacy_events.6.a:0 "Şanlı bir diplomatik zafer!"
  kashgar_diplomacy_events.7.t:0 "Çin Ültimatomu Reddetti: Savaş Başlıyor!"
  kashgar_diplomacy_events.7.d:0 "Pekin sarayı ültimatomumuzu reddederek ordularını seferber etti. Doğu Türkistan'ın kaderi savaş meydanlarında tayin edilecek!"
  kashgar_diplomacy_events.7.a:0 "Gazamız mübarek olsun! Haydi harbe!"
  kashgar_diplomacy_events.11.t:0 "Doğu Türkistan'dan Gelen Destek Teklifi"
  kashgar_diplomacy_events.11.d:0 "Yedişehir Emiri Yakub Beg'in elçileri Babıali'ye vasıl oldu. Doğu Türkistan müslümanlarının kurtuluşu için Osmanlı Devleti'nden destek talep etmektedirler."
  kashgar_diplomacy_events.11.a:0 "Teklifi kabul ediyoruz! Müslüman kardeşlerimize destek vereceğiz."
  kashgar_diplomacy_events.11.b:0 "Devletimiz uzak Asya bozkırlarında siyasi bir ihtilafa girmeye müsait değildir."
  kashgar_diplomacy_events.12.t:0 "Kaşgar'dan Gelen Destek ve İmtiyaz Teklifi"
  kashgar_diplomacy_events.12.d:0 "Yedişehir Devleti, Çin'e açacağı bağımsızlık savaşında Büyük Britanya'nın desteğini talep ediyor. Karşılığında pazar imtiyazı vadetmektedirler."
  kashgar_diplomacy_events.12.a:0 "Asya'daki ticari menfaatlerimiz için bu desteği sağlayacağız!"
  kashgar_diplomacy_events.12.b:0 "Kraliçe'nin imkânlarını bu bilinmez ihtilafa sürüklemeyeceğiz."
