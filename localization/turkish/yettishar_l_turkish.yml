  yts_civil_task_1_status_tt:0 "1. İçişleri (Home Affairs): İçişleri yasa grubundan herhangi bir yasanın aktif edilmesi"
  yts_civil_task_2_status_tt:0 "2. Asayiş (Policing): Yerel Polis veya Nizami Polis yasasının geçirilmesi (yada polis kurumu >= 2)"
  yts_civil_task_3_status_tt:0 "3. Ekonomik Merkezileşme: Gelenekselcilik (Traditionalism) yasasından çıkılması"
  je_yettishar_military_reform_status:0 "Orduyu dört askeri reformla dönüştürün: Babıali askeri heyeti, Mekteb-i Harbiye, Londra danışmanlığı ve Nizami Taburlar — ayrıca kışla, silah sanayi ve profesyonel ordu şartlarını tamamlayın."
  yts_mil_task_1_status_tt:0 "1. Mekteb-i Harbiye ve Talim: Kışlalar binalarımızın hiçbirinde \"Talim Yok\" yönteminin aktif olmaması ve ordunun %80'inin Düzenli/Nizami Ordu olması"
  yts_mil_task_2_status_tt:0 "2. Fişekhane ve Top Dökümhanesi: Ülke genelinde toplam en az 2 seviye Silah Fabrikaları ve 1 seviye Topçu Dökümevi bulunması"
  yts_mil_task_3_status_tt:0 "3. Köylü Askerlerden Kurtuluş: "Köylü Askerler" (Peasant Levies) yasasından çıkılmış olması"
  yettishar_ottoman_officers:0 "Osmanlı Zabitleri ve Bağımsızlık Garantisi"
  yettishar_ottoman_officers_desc:0 "Dersaadet ile ilişkilerimizi (>= 30) kullanarak Osmanlı Devleti'nin Kaşgar Hanlığı'nın bağımsızlığını resmi antlaşmayla garanti altına almasını (Guarantee Independence) ve ordumuza haftalık 1000 altınlık (aylık ~4000) mühimmat/ekipman aktarımı (Bankroll) yapmasını sağlarız. Zabitler 5 yıl boyunca +%25 Eğitim Hızı ve +%15 Ordu Organizasyonu sağlar."
  yettishar_british_rifles:0 "Forsyth Misyonu ve Martini-Henry Tüfekleri"
  yettishar_british_rifles_desc:0 "Büyük Britanya ile iyi ilişkilerimizi (>= 30) fırsat bilerek hazinemizden 10.000 altın karşılığında Martini-Henry yivli tüfekleri satın alırız. Ordu 5 yıl boyunca +%15 Saldırı/Savunma ve -%20 İkmal Tüketimi kazanır, ayrıca Yivli/Arkadan Dolmalı Tüfekler teknolojisine +1500 araştırma puanı aktarılır. (Rusya ile ilişkiler -15 düşer)."
  yts_civil_task_4a_status_tt:0 "4a. Devlet İdaresi: Ülke genelinde toplam en az 8 seviye Devlet Yönetim Binası bulunması"
  yts_civil_task_4b_status_tt:0 "4b. Kâğıt Üretimi: Ülke genelinde toplam en az 2 seviye Kâğıt Fabrikaları bulunması"
  yts_mil_task_1a_status_tt:0 "1a. Kışla Talim Yöntemi: Kışlalar binalarımızın hiçbirinde \"Talim Yok\" yönteminin aktif olmaması"
  yts_mil_task_1b_status_tt:0 "1b. Nizami Ordu Oranı: Ordumuzun en az %80'inin Düzenli/Nizami Ordu olması"
  yts_mil_task_2a_status_tt:0 "2a. Silah Fabrikaları: Ülke genelinde toplam en az 2 seviye Silah Fabrikaları bulunması"
  yts_mil_task_2b_status_tt:0 "2b. Topçu Dökümevi: Ülke genelinde toplam en az 1 seviye Topçu Dökümevi bulunması"
  yts_civil_task_4_header_tt:0 "4. Devlet İdaresi Binaları (Aşağıdaki bina inşaat alt şartları sağlanmalıdır): #indent_newline:3 "
  yts_mil_task_1_header_tt:0 "1. Mekteb-i Harbiye ve Talim (Aşağıdaki ordu nizamı alt şartları sağlanmalıdır): #indent_newline:3 "
  yts_mil_task_2_header_tt:0 "2. Fişekhane ve Top Dökümhanesi (Aşağıdaki askeri sanayi alt şartları sağlanmalıdır): #indent_newline:3 "
  je_yettishar_modernization_status:0 "Kaşgar'da kurumsal ve sivil bir devlet yapısı inşa etmek için aşağıdaki 4 temel reformu ve alt şartlarını tamamlamalıyız:\n #b 1. İçişleri (Home Affairs):#! İçişleri yasa grubundan bir yasanın aktif edilmesi\n #b 2. Asayiş (Policing):#! Polis yasasının geçirilmesi veya Polis kurumunun en az Seviye 2 yapılması\n #b 3. Ekonomik Merkezileşme:#! Gelenekselcilik yasasından çıkılması\n #b 4. Devlet İdaresi Binaları (Alt Şartlar):#!\n  • #p Alt Şart 4a:#! Ülke genelinde toplam en az #b 8 seviye Devlet Yönetim Binası#!\n  • #p Alt Şart 4b:#! Ülke genelinde toplam en az #b 2 seviye Kâğıt Fabrikaları#!"
 yts_modernization_reward_tt:0 "• 20 yıl boyunca #b Tam Devlet Modernleşmesi#! etkenini kazanır:\n  • +%10 Otorite\n  • +%10 Bürokrasi\n  • +%15 Vergi Kapasitesi\n• #p +50 Saygınlık#! ve #p +%10 Sadık Nüfus#! kazanılır"
 yts_military_reform_reward_tt:0 "• 15 yıl boyunca #b Nizami Ordu’nun Zaferi#! etkenini kazanır:\n  • +%20 Saldırı\n  • +%20 Savunma\n  • +%25 Eğitim Oranı\n  • +%20 Ordu Araştırma Hızı\n• #p +40 Saygınlık#! ve #p +%5 Sadık Nüfus#! kazanılır"
  yettishar_events.103.f:0 "Avrupai talim ve nizamla donatılan bu yeni ordu, devletimizin yılmaz koruyucusu olacaktır."
  yettishar_ottoman_defensive_pact_tt:0 "Osmanlı Devleti ile #v Savunma Paktı#! kurulacak"

  kashgar_rebellion_on_complete_tt:0 "Doğu Türkistan (Yedişehir) Bağımsızlık Zaferi kutlanır ve +25 Prestij kazanılır."
  kashgar_crisis_won_tt:0 "Çin, Bağımsızlık Taleplerimizi kabul eder veya savaş kazanılır"
  kashgar_holds_tarim_tt:0 "Tarım (Tanrı Dağları / Tianshan) doğrudan veya tabi devlet üzerinden kontrol ediliyor"
  kashgar_holds_dzungaria_tt:0 "Çungarya (Dzungaria) doğrudan veya tabi devlet üzerinden kontrol ediliyor"
