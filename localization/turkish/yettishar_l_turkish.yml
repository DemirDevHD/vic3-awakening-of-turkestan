# Kriz Eventleri
  kashgar_diplomacy_events.1.t:0 "Halifeye Giden Elçiler"
  kashgar_diplomacy_events.1.d:0 "Doğu Türkistan'ın bağımsızlığı ve Çin zulmünden kurtuluşu için en büyük umudumuz İstanbul'daki Halife'nin desteğidir. Elçilerimiz değerli hediyeler ve diplomatik mektuplarla Dersaadet'e ulaştılar. Eğer Osmanlı İmparatorluğu arkamızda durursa, Çin'in kılıcı bize kolay kolay uzanamayacaktır."
  kashgar_diplomacy_events.1.a:0 "Yüce Padişah'tan müjdeli haberleri bekleyelim."
  kashgar_diplomacy_events.2.t:0 "Büyük Oyun ve Londra"
  kashgar_diplomacy_events.2.d:0 "İngiliz İmparatorluğu'nun Hindistan'daki çıkarları, Orta Asya'da güçlü ve bağımsız bir tampon devletin varlığını gerektiriyor. Kraliçe Victoria'nın elçileriyle masaya oturduk. Eğer ticari imtiyazlar ve bölgesel işbirliği sözü verirsek, dünyanın en büyük donanması ve ordusu diplomatik ağırlığını bizim için koyabilir."
  kashgar_diplomacy_events.2.a:0 "İngiliz aslanı uyanıyor."
  kashgar_diplomacy_events.3.t:0 "Kuzeyin Ayısı ile Pazarlık"
  kashgar_diplomacy_events.3.d:0 "Rus Çarlığı'nın Orta Asya'daki hızlı ilerleyişi herkesin malumu. Ancak St. Petersburg'daki Çar, Çin ile sınırlarını güvence altına almak için bizimle bir anlaşma yapmaya yatkın olabilir. Eğer onlara Dış Mançurya ve Amur gibi sınır garantileri verirsek, Rus süngüleri Çin'e karşı yanımızda parlayabilir."
  annex_kazakh_zhuz_desc:0 "Büyük, Orta ve Küçük Kazak Cüzlerini imparatorluğa katarak Kazak kültürünü ana kültürümüz yap."
