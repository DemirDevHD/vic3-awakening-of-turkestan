 yettishar_borders_turkmen_lands_tt:0 "You or one of your subjects must have a land border with Turkmenistan or the Turkmenia/Merv state regions"

 turkmen_issue_events.1.t:0 "Tribal Persuasion"
 turkmen_issue_events.1.d:0 "Our envoys among the Teke, Yomut, and Ersari return with mixed answers. Binding them to our banner will advance the Turkmen Issue."
 turkmen_issue_events.1.f:0 "Kinship and fear walk the same steppe path."
 turkmen_issue_events.1.a:0 "Win their loyalty with gifts and promises"
 turkmen_issue_events.1.b:0 "Strike a partial bargain with the elders"
 turkmen_issue_events.1.c:0 "Let the talks collapse"

 turkmen_issue_events.2.t:0 "Nomad Resistance"
 turkmen_issue_events.2.d:0 "Nomad bands refuse taxes and defy patrols. How we answer will shape both order and Turkmen Issue progress."
 turkmen_issue_events.2.f:0 "The steppe does not yield without a contest."
 turkmen_issue_events.2.a:0 "Suppress the nomads with the army"
 turkmen_issue_events.2.b:0 "Bargain for peace with the clan chiefs"
 turkmen_issue_events.2.c:0 "Take a soft approach and let it pass"

 turkmen_issue_events.10.t:0 "Teke Bargaining"
 turkmen_issue_events.10.d:0 "Teke elders offer recognition on their terms. Accepting advances the Issue; refusal risks radicals."
 turkmen_issue_events.10.f:0 "A carpet of words before a carpet of loyalty."
 turkmen_issue_events.10.a:0 "Accept the bargain and move on"
 turkmen_issue_events.10.b:0 "Refuse and let tempers flare"

 turkmen_issue_events.11.t:0 "Yomut Pastures"
 turkmen_issue_events.11.d:0 "A grazing dispute among the Yomut threatens local order. Settling it wins goodwill and progress."
 turkmen_issue_events.11.f:0 "Grass and glory are both scarce."
 turkmen_issue_events.11.a:0 "Settle the grazing dispute peacefully"
 turkmen_issue_events.11.b:0 "Ignore the unrest for now"

 turkmen_issue_events.12.t:0 "Caravan Raid"
 turkmen_issue_events.12.d:0 "A caravan is plundered on the desert road. Tightening the routes restores order and hints that Alaman raids should be banned."
 turkmen_issue_events.12.f:0 "Alaman shadows stretch long at dusk."
 turkmen_issue_events.12.a:0 "Tighten patrols along the caravan routes"

 turkmen_issue_events.13.t:0 "Persian Complaint"
 turkmen_issue_events.13.d:0 "Persia protests frontier raids. A mild apology costs relations; steering toward an Alaman ban yields a little progress."
 turkmen_issue_events.13.f:0 "Tehran watches the desert edge."
 turkmen_issue_events.13.a:0 "Offer Tehran a mild apology"
 turkmen_issue_events.13.b:0 "Hint at banning the Alaman raids"

 turkmen_issue_events.14.t:0 "Nomad Wedding Feast"
 turkmen_issue_events.14.d:0 "A great tribal wedding opens doors. Gifts and envoys can convert hospitality into political loyalty."
 turkmen_issue_events.14.f:0 "Hospitality can bind what steel cannot."
 turkmen_issue_events.14.a:0 "Send gifts and envoys to the camps"

 turkmen_issue_events.16.t:0 "Colonial Bureau Report"
 turkmen_issue_events.16.d:0 "Clerks report on colonial administration over Turkmen lands. Colonial Affairs makes the report far more useful."
 turkmen_issue_events.16.f:0 "Ink advances where banners wait."
 turkmen_issue_events.16.a:0 "Review the colonial office's report"

 dp_turkmen_colonization:0 "Turkmen Colonization"
 turkmen_colonization:0 "Conquer Harezm"
 dp_turkmen_colonization_desc:0 "A play to take Harezm and Uralsk from Turkmenistan. Costs 2+2 Infamy."
 turkmen_colonization_desc:0 "Transfer Harezm (and ensure Uralsk) from Turkmenistan. Costs 2 Infamy."
 turkmen_colonization_uralsk:0 "Conquer Uralsk"
 turkmen_colonization_uralsk_desc:0 "Transfer Uralsk from Turkmenistan. Costs 2 Infamy."

