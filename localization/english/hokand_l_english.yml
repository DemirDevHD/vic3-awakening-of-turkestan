  modifier_hokand_stagnant_ming_rule:0 "Stagnant Ming Rule"
  modifier_hokand_stagnant_ming_rule_desc:0 "Following the collapse of Yakub Beg's bid for power, Kokand is trapped under a decaying, puppet administration. All paths toward reform are permanently closed."
  modifier_hokand_frontier_command:0 "Frontier Command Influence"
  modifier_hokand_frontier_command_desc:0 "Command of the army and frontier defenses rests with Yakub Beg's loyalists."
