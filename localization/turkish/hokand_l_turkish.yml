# --- HOKAND HANLIĞI (FERGANA VADİSİ) - GÜNLÜK GİRDİSİ GRUBU ---
  je_group_hokand:0 "Hokand Hanlığı (Fergana Vadisi)"
# --- GÜNLÜK GİRDİSİ 1: FERGANA'DA OTORİTE BOŞLUĞU ---
  je_hokand_void_of_authority:0 "Fergana'da Otorite Boşluğu"
  je_hokand_void_of_authority_reason:0 "1842 suikastının ardından hanlık; aşiretler, ulema ve Taşkent garnizonu arasında bölünmüş durumda. Tahtın kaderini Atalık Yakub Beg ile saray arasındaki güç dengesi belirleyecek."
  je_hokand_void_of_authority_desc:0 "Merkezi otoritemiz garnizonların ve Kıpçak beylerinin baskısı altında eriyor. Saray otoriteyi toparlayana kadar ya da Yakub Beg'in askeri kanadı üstün gelene kadar bu mücadele sürecek."
  je_hokand_void_of_authority_lobby:0 "Otorite Boşluğu ve Taht Kavgası"
  je_hokand_void_of_authority_lobby_reason:0 "1842 kanlı suikastinin ardından tahta çıkan kukla Murat Beg, saray entrikaları ve dış baskılar altında eziliyor. Devletin çökmüş otoritesi, sınırları savunmak ve düzeni sağlamak için ordunun başındaki Atalık Gazi Yakub Beg'e muhtaç."
  je_hokand_void_of_authority_lobby_desc:0 "1842 kanlı suikastinin ardından tahta çıkan kukla Murat Beg, saray entrikaları ve dış baskılar altında eziliyor. Devletin çökmüş otoritesi, sınırları savunmak ve düzeni sağlamak için ordunun başındaki Atalık Gazi Yakub Beg'e muhtaç."
  je_hokand_status:0 "Saray ile Taşkent garnizonu ve Fergana beyleri arasındaki güç dengesi (ilerleme barlarından anlık puanları görebiliriz):"
# --- GÜNLÜK GİRDİSİ 2: MERKEZİ OTORİTENİN TESİS EDİLMESİ ---
  je_hokand_secure_authority:0 "Merkezi Otoritenin Tesis Edilmesi"
  je_hokand_secure_authority_reason:0 "Yakub Beg idaresindeki saray, yerel beylerin ve Kıpçak aşiretlerinin feodal imtiyazlarını kırarak Fergana Vadisi ve sınır boylarında mutlak otorite kurmalı."
  je_hokand_secure_authority_desc:0 "Hanlık iç kargaşaya son verip tek bir merkezi yönetim altında birleşmeli. Fergana'da denetim sağlandıkça ve Kıpçak atlıları saraya bağlandıkça devletin bağımsızlığı kalıcı hale gelecek."
  je_hokand_secure_authority_lobby:0 "Otoritenin Tesis Edilmesi"
  je_hokand_secure_authority_lobby_reason:0 "Hokand Hanlığı iç kargaşaya son vermeli ve tek bir otorite altında birleşmelidir."
  je_hokand_secure_authority_lobby_desc:0 "Hokand Hanlığı iç kargaşaya son vermeli ve tek bir otorite altında birleşmelidir."
  je_hokand_secure_authority_status:0 "Merkezi otorite ve göçebe aşiret desteği ilerlemesi (aşağıdaki barlardan anlık puanları görebiliriz):"
