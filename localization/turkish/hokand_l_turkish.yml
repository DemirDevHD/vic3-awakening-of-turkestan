  je_hokand_void_of_authority_status:0 "Fergana'daki merkezi otoriteyi Yakub Beg'in hizbi ele geçirmeden önce yeniden tesis etmeliyiz."
  modifier_hokand_authority_vacuum_desc:0 "Sert bir merkezi otoritenin yokluğu, devlet kurumlarını zayıflatıyor."
  modifier_hokand_nomad_unrest_desc:0 "Kıpçak ve Kırgız aşiretlerindeki huzursuzluk, ordu moralini ve vergi tahsilatını zorluyor."
  modifier_hokand_yettishar_established_desc:0 "Yedişehir'in yeni nizamı orduyu istikrara kavuşturmuş ve tahtın meşruiyetini güçlendirmiştir."
  modifier_hokand_ghazi_fervor_desc:0 "Gaza için dini heyecan, dindarları güçlendirir ve orduyu pekiştirir."
  modifier_hokand_palace_intrigue_desc:0 "Saray hizipleri birbirine karşı entrika çevirerek tahtın otoritesini aşındırıyor."
  modifier_hokand_yakub_military_influence_desc:0 "Yakub Beg'in ordu üzerindeki artan etkisi, disiplini ve sadakatleri yeniden şekillendiriyor."
  modifier_hokand_tashkent_nobility_pact_desc:0 "Taşkent'in Özbek soyluları, idari kayırmacılık karşılığında mali destek sağlar."
  modifier_hokand_peasant_militia_support_desc:0 "Silahlı köylü milisleri, devlet gelirine bir miktar zarar pahasına moral güçlendirir."
  modifier_hokand_nomad_cavalry_raids_desc:0 "Seferber edilen aşiret süvarileri sınıra akın düzenleyerek taarruz ve moralı güçlendirir."
  modifier_hokand_border_patrols_desc:0 "Sınırdaki ortak devriyeler ticareti korur ve huzursuzluğu azaltır."
