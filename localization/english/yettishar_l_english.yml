 yettishar_events.110.t:0 "Alim Kul at the Head of the Ulema"
 yettishar_events.110.d:0 "Alim Kul Muhammad rises among the devout. A militant voice of the ulema, he takes leadership of the Devout and stands ready to serve as a general of the faith."
 yettishar_events.110.f:0 "'The sword of faith and the word of the scholars are one.'"
 yettishar_events.110.a:0 "Let Alim Kul lead the Devout."
 yettishar_events.111.t:0 "Heir Departs for the Porte"
 yettishar_events.111.d:0 "Beg Kuli Beg sets out for Constantinople. Court expenses and gifts for the Sublime Porte empty the treasury, while Armed Forces grumble and the Intelligentsia applauds the gesture."
 yettishar_events.111.f:0 "The road to Dersaadet is long, but knowledge awaits at its end."
 yettishar_events.111.a:0 "May God protect the heir on his journey."
 yettishar_events.112.t:0 "Heir Returns from the Porte"
 yettishar_events.112.d:0 "After two years in Constantinople, Beg Kuli Beg returns transformed — a reformer steeped in learning, diplomacy, and modern ideas, yet still brave and ambitious."
 yettishar_events.112.f:0 "'I have seen how a state is governed from the Bosphorus to the Golden Horn.'"
 yettishar_events.112.a:0 "Welcome home, Beg Kuli Beg."
 yettishar_events.120.t:0 "Ottoman Military Mission Arrives"
 yettishar_events.120.d:0 "Officers sent by the Sublime Porte begin drilling our staff and sharing modern military doctrine. Their presence will guide our research for a generation."
 yettishar_events.120.f:0 "From Dersaadet to Kashgar, the same drums of reform beat."
 yettishar_events.120.a:0 "Accept the mission with honor."
 yettishar_events.121.t:0 "The War College Opens"
 yettishar_events.121.d:0 "In the capital, a new war college rises. Cadets will study staff work, logistics, and modern arms — the first serious military academy of our state."
 yettishar_events.121.f:0 "Where once only tribal lore held sway, now the sciences of war are taught."
 yettishar_events.121.a:0 "Open the War College."
 yettishar_events.122.t:0 "London Military Advisory Mission"
 yettishar_events.122.d:0 "British advisors offer to transfer knowledge. Choose a technology Britain possesses that we lack, or focus purely on accelerating military research."
 yettishar_events.122.f:0 "The Great Game offers more than rifles — it offers doctrine."
 yettishar_events.122.a:0 "Adopt Rifling from British manuals."
 yettishar_events.122.b:0 "Adopt General Staff organization."
 yettishar_events.122.c:0 "Adopt Field Works."
 yettishar_events.122.g:0 "Adopt Logistics."
 yettishar_events.122.e:0 "Adopt Screw Frigate designs."
 yettishar_events.122.h:0 "Focus on military research speed instead."
 yettishar_events.122.i:0 "Percussion Cap Training"
 yettishar_events.122.j:0 "Explosive Shell Program"
 yettishar_events.122.k:0 "Field Triage System"
 yettishar_events.122.l:0 "Naval Budget Reform"
 yettishar_events.122.m:0 "Port Modernization"
 yettishar_events.123.t:0 "Regular Battalions Formed"
 yettishar_events.123.d:0 "Nizami battalions take the field: drilled, conscripted, and ready to replace tribal levies as the backbone of the army."
 yettishar_events.123.f:0 "The age of irregular horsemen alone is ending."
 yettishar_events.123.a:0 "Form the regular battalions."


