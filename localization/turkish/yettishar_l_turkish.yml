  yettishar_promote_ahmad_danish_desc:0 "Kamil Harezmi davet edildikten sonra ve 1870 yılından itibaren Ahmet Daniş'i Aydınlar liderliğine getirebiliriz. Modernleşme hareketine +%120 cazibe ve +%50 aktivizm kazandırır."
