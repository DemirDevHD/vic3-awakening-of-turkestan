# ── KAŞGAR VE YEDİŞEHİR DİPLOMATİK KRİZİ ─────────────────────────────────────
  btn_trigger_kashgar_crisis_name:0 "Doğu Türkistan'ın Bağımsızlığını İlan Et!"
  btn_trigger_kashgar_crisis_desc:0 "Çin İmparatorluğu'na Doğu Türkistan eyaletlerinin devredilmesi ve bağımsızlığımızın tanınması için ültimatom gönderilir."
  btn_trigger_kashgar_crisis:0 "Doğu Türkistan'ın Bağımsızlığını İlan Et!"
  je_kashgar_rebellion:0 "Doğu Türkistan'ın Kurtuluşu"
  JE_KASHGAR_REBELLION:0 "Doğu Türkistan'ın Kurtuluşu"
  je_kashgar_rebellion_reason:0 "Doğu Türkistan halkları Yakub Beg önderliğinde bağımsızlık sancağını açmıştır. Tarım ve Çungarya topraklarını — diplomasi veya savaşla — ele geçirerek bu mücadeleyi tamamlamalıyız."
  je_kashgar_rebellion_status:0 "Aşağıdaki kararlarla büyük güç desteği arayın; ardından Tarım ve Çungarya topraklarını alın. Bu günlük kaydı, söz konusu topraklar elinizdeyken tamamlanır."
  kashgar_rebellion_complete_tooltip:0 "Tarım ve Çungarya toprakları (doğrudan veya tabi devlet üzerinden) kontrol edildiğinde tamamlanır."
# ── YEDİŞEHİR ELÇİ GÖNDERME EVENTLERİ (101, 102, 103) ────────────────────────
  kashgar_diplomacy_events.101.t:0 "Dersaadet'e Elçi Gönderilmesi"
  kashgar_diplomacy_events.101.d:0 "Özgürlük mücadelemiz için Halife Sultan'ın desteği hayati önem taşımaktadır. Elçilerimiz İstanbul'da Babıali amirleriyle görüştü."
  kashgar_diplomacy_events.101.f:0 "Halife'nin sancağı Asya'da dalgalanacak mı?"
  kashgar_diplomacy_events.101.a:0 "Dersaadet'ten doğrudan destek ve diplomasi yardımı talep edelim."
  kashgar_diplomacy_events.102.t:0 "Londra'ya Diplomatik Elçi Gönderilmesi"
  kashgar_diplomacy_events.102.d:0 "Büyük Britanya'nın Asya'daki menfaatleri, Çin ve Rus yayılmacılığına karşı güçlü bir tampon devlet gerektirmektedir. Kraliçe'nin elçileriyle masaya oturduk."
  kashgar_diplomacy_events.102.f:0 "Asya'da Büyük Oyun'un hamleleri oynanıyor..."
  kashgar_diplomacy_events.102.a:0 "Londra'dan destek talep edip serbest ticaret imtiyazı verelim."
  kashgar_diplomacy_events.103.t:0 "St. Petersburg ile Diplomatik Pazarlık"
  kashgar_diplomacy_events.103.d:0 "Rus Çarlığı'nın Uzak Doğu ve Mançurya üzerindeki emelleri malumdur. Elçilerimiz Çar'ın sarayına diplomatik seçenekler sunmak üzere hazırdır."
  kashgar_diplomacy_events.103.f:0 "Kuzey ayısı ile masaya otururken dikkatli olmalıyız."
  kashgar_diplomacy_events.103.neutral:0 "Rus Çarlığı'ndan sadece tarafsızlık ve sınır garantisi talep edelim."
  kashgar_diplomacy_events.103.war:0 "Mançurya toprakları karşılığında Rus Çarlığı'ndan destek talep edelim."
  btn_kashgar_support_ottoman_desc:0 "Osmanlı Devleti'nden destek talep edilir. Zafer halinde Osmanlı Halifelik Prestiji ve Çin'den savaş tazminatı kazanır."
  btn_kashgar_support_ottoman:0 "Osmanlı Desteğini İste"
  btn_kashgar_support_russian_name:0 "Rus Desteğini İste"
  btn_kashgar_support_russian_desc:0 "Rus Çarlığı'na tarafsızlık veya Mançurya toprakları karşılığında askeri destek teklif edilir."
  btn_kashgar_support_russian:0 "Rus Desteğini İste"
# ── DİĞER YEDİŞEHİR GÜNLÜK GİRDİLERİ VE KARARLARI ───────────────────────────
  je_yettishar_military_reform:0 "Nizami Ordu ve Askeri Yeniden Yapılanma"
  je_yettishar_military_reform_reason:0 "Kaşgar ordusunu bozkır aşiret süvarileri yapısından çıkarıp, ateşli silahlara ve topçu bataryalarına sahip disiplinli bir nizami orduya dönüştürmeliyiz."
  je_yettishar_ottoman_aid:0 "Dersaadet'in Yardımı"
  je_yettishar_ottoman_aid_reason:0 "Halife Sultan'ın devletimize gönderdiği destek idaremizin gücünü artırıyor."
  je_yettishar_save_uyghurs:0 "Uygur Kardeşlerimizi Kurtar"
  je_yettishar_save_uyghurs_reason:0 "Çin esareti altında ezilen Müslüman Türk halklarını bağımsızlığa kavuşturmak en büyük gayemizdir."
  je_yettishar_unite_turkestan:0 "Türkistan'ın Birliği"
  je_yettishar_unite_turkestan_reason:0 "Orta Asya'daki dağınık Türk hanlıklarını ve halklarını Kaşgar sancağı altında tek bir devlette birleştirmeliyiz."
  je_yettishar_yakub_beg_rule:0 "Yakub Beg'in Hakimiyeti"
  je_yettishar_yakub_beg_rule_reason:0 "Atalık Gazi Yakub Beg'in adaleti ve demir yumruğu Doğu Türkistan'da nizamı sağlıyor."
