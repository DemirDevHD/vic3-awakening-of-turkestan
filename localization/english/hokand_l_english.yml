# --- JOURNAL ENTRY GROUP & TITLES ---
  je_group_hokand:0 "Khanate of Hokand (Fergana Valley)"
  je_hokand_void_of_authority:0 "Power Vacuum in Fergana"
  je_hokand_void_of_authority_reason:0 "Following the 1842 assassination, the Khanate is divided between tribes, ulema, and the Tashkent garrison. The balance between Atalik Yakub Beg and the court will decide the state's fate."
  je_hokand_void_of_authority_status:0 "We must restore the Khanate's central authority in Fergana before Yakub Beg's faction seizes it outright."
  je_hokand_status:0 "Current balance of power between the Court and the army (see the exact scores on the progress bars below)."
  je_hokand_secure_authority:0 "Establishing Central Authority"
  je_hokand_secure_authority_reason:0 "The court under Yakub Beg must break the feudal privileges of local begs and Kipchak tribes to establish undisputed rule across the Fergana Valley and its frontiers."
  je_hokand_secure_authority_status:0 "Central authority and tribal loyalty across Fergana (see the exact scores on the progress bars below)."
# --- LOBBY KEYS ---
  je_hokand_void_of_authority_lobby:0 "Void of Authority & Struggle for Power"
  je_hokand_void_of_authority_lobby_reason:0 "Following the bloody assassination of 1842, the puppet Murad Beg was placed on the throne, overwhelmed by palace intrigue and foreign pressure. The shattered authority of the state is forced to rely on the military commander Atalik Ghazi Yakub Beg to defend its borders and maintain order."
  je_hokand_void_of_authority_lobby_desc:0 "Following the bloody assassination of 1842, the puppet Murad Beg was placed on the throne, overwhelmed by palace intrigue and foreign pressure. The shattered authority of the state is forced to rely on the military commander Atalik Ghazi Yakub Beg to defend its borders and maintain order."
  je_hokand_secure_authority_lobby:0 "Securing Authority"
  je_hokand_secure_authority_lobby_reason:0 "The Kokand Khanate must end its internal chaos and unite under a single authority."
  je_hokand_secure_authority_lobby_desc:0 "The Kokand Khanate must end its internal chaos and unite under a single authority."
