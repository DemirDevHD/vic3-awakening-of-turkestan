  yettishar_events.104.t:0 "Dersaadet'ten Zabit Heyeti Geldi"
  yettishar_events.104.d:0 "Halife Sultan'ın iradesiyle gönderilen Osmanlı subay ve askeri heyeti Kaşgar'a ulaştı. Nizami ordumuzun talim ve teçhizatında yeni bir dönem başlıyor."
  yettishar_events.104.f:0 "Hilal ile yıldızın gölgesinde sarsılmaz bir ordu yükseliyor."
  yettishar_events.104.a:0 "Halife'nin subaylarına hoş geldiniz diyoruz!"
  yettishar_events.105.t:0 "Forsyth Misyonu ve İngiliz Tüfekleri"
  yettishar_events.105.d:0 "Sir Thomas Douglas Forsyth başkanlığındaki İngiliz misyonu ile yapılan anlaşmalar neticesinde modern Martini-Henry tüfekleri ve askeri mühimmat envanterimize dâhil oldu."
  yettishar_events.105.f:0 "İngiliz teknolojisi ve Türkmen süvarilerinin cesareti bir araya geliyor."
  yettishar_events.105.a:0 "Ordumuz artık modern silahlara sahip!"

 btn_yettishar_turkmenistan_name:0 "Türkmenistan Meselesi"
 btn_yettishar_turkmenistan_desc:0 "İstikbal üzerinden Türkmenistan Meselesi günlük kaydını açar."
 je_yettishar_turkmenistan:0 "Türkmenistan Meselesi"
 je_yettishar_turkmenistan_reason:0 "Teke, Yomut ve Ersari'yi düğmeler, olaylar ve aylık idareyle 200'e taşıyın; Harezm ile Uralsk için kolonizasyon savaşını kazanın. Tamamlanınca Uralsk, Türkmenistan ve Merv payları şahsi birlik altındaki Türkmenistan'da toplanır."
 je_yettishar_turkmenistan_status:0 "Mesele yeni: aşiretleri ikna edin, göçebe krizlerini yönetin, Alaman'ı yasaklayın; Sömürge İşleri ile kolonizasyon savaşını açın. Hedef: 200 ilerleme ve savaş zaferi."
 je_yettishar_turkmenistan_status_mid:0 "İlerleme ortada — düğmeleri kullanmaya ve aylık olaylara devam edin. Kolonizasyon zaferi hâlâ gerekli."
 je_yettishar_turkmenistan_status_near:0 "İlerleme neredeyse dolu — son adımları tamamlayın. Kolonizasyon zaferi yoksa savaşı açın veya bitirin."
 je_yettishar_turkmenistan_status_war_pending:0 "Kolonizasyon diplomatik oyunu sürüyor — Harezm ve Uralsk taleplerini kabul ettirin veya savaşı kazanın."
 je_yettishar_turkmenistan_status_bar_done:0 "İlerleme 200/200 — hâlâ kolonizasyon zaferi gerekli. Savaşı açın veya bitirin."
 je_yettishar_turkmenistan_status_war_done:0 "Kolonizasyon kazanıldı — ilerlemeyi düğmeler ve olaylarla 200'e çıkarın."
 je_yettishar_turkmenistan_status_ready:0 "Her iki şart da sağlandı — mesele tamamlanabilir. Uralsk, Türkmenistan ve Merv şahsi birlik altında toplanacak."
 btn_turkmenistan_complete_name:0 "Türkmenistan'ı Şahsi Birlik Yap"
 btn_turkmenistan_complete_desc:0 "Uralsk, Türkmenistan ve Merv paylarınızı ayrı bölgeler olarak şahsi birlik altındaki Türkmenistan'a devreder; başkent Türkmenistan olur."

