# Milestone Modifiers
  modifier_yettishar_home_affairs_bonus:0 "Home Affairs & Statutory Order"
  modifier_yettishar_home_affairs_bonus_desc:0 "Newly established home affairs institutions streamline tax collection and administration."
  modifier_yettishar_police_bonus:0 "Kashgar Police & Public Safety Force"
  modifier_yettishar_police_bonus_desc:0 "A regular police force curbs unrest and radical agitation."
  modifier_yettishar_economic_reform_bonus:0 "Fiscal & Economic Reform"
  modifier_yettishar_economic_reform_bonus_desc:0 "Moving away from traditionalist economic policy improves industrial output and tax revenue."
  modifier_yettishar_admin_building_bonus:0 "Expanded Government Administration"
  modifier_yettishar_admin_building_bonus_desc:0 "A larger bureaucratic apparatus and paper industry improve state administration."
  modifier_yettishar_tax_reform_bonus:0 "Regular Tax & Revenue System"
  yettishar_events.101.f:0 "'The pen fortifies the foundation of the state long before the sword ever can. Kashgar's future lies in knowledge and order.'"
  yettishar_events.101.a:0 "Welcome to Kashgar, Kamil Khwarezmi! Lead our intelligentsia."
  yettishar_events.102.t:0 "A New Generation of Reform: Ahmad Donish"
  yettishar_events.102.d:0 "Renowned for his diplomatic missions from Bukhara and his critical writings, Ahmad Donish (Ahmad Mahdumi Kalla) has been chosen to lead the Intelligentsia in Kashgar. Aiming to synthesize Eastern heritage with Western scientific progress, Donish seeks deep restructuring of our bureaucracy."
  yettishar_events.102.f:0 "'We cannot withstand the tempests of the modern era using obsolete methods.'"
  yettishar_events.102.a:0 "Ahmad Donish shall be the new voice of our reforms."
  yettishar_events.103.t:0 "Army Modernization: Regular Army"
  yettishar_events.103.d:0 "Orders have been issued to raise a professional Regular Army on European and Ottoman standards. Barracks, artillery batteries, and foreign assistance will modernize the army."
  yettishar_events.103.f:0 "Trained in European drill and discipline, this new army shall be the steadfast guardian of our state."
  yettishar_events.103.a:0 "Let the Regular Army reforms begin!"
  yettishar_events.104.t:0 "Ottoman Officer Mission Arrives from Dersaadet"
  yettishar_events.104.d:0 "By the will of the Caliph-Sultan, an Ottoman officer and military mission has reached Kashgar. A new era begins for the drill and equipment of our regular army."
  yettishar_events.104.f:0 "Under the crescent and star, an unshakable army rises."
  yettishar_events.104.a:0 "We welcome the Caliph's officers!"
  yettishar_events.105.t:0 "The Forsyth Mission and British Rifles"
  yettishar_events.105.d:0 "Under agreements with the British mission led by Sir Thomas Douglas Forsyth, modern Martini-Henry rifles and military munitions have entered our inventory."
  yettishar_events.105.f:0 "British technology and Turkmen cavalry courage join together."
  yettishar_events.105.a:0 "Our army now wields modern arms!"
  modifier_yettishar_admin_buildings_bonus:0 "Modern Government Administration"
  modifier_yettishar_civil_reform_completed:0 "Modern Civil Bureaucracy"
  modifier_yettishar_barracks_bonus:0 "Military Academy & Regular Barracks"
  modifier_yettishar_barracks_bonus_desc:0 "Modernized barracks and drilled infantry improve unit morale and defense."
  modifier_yettishar_arms_bonus:0 "Munitions Foundries & Ammunition Manufacture"
  modifier_yettishar_arms_bonus_desc:0 "Domestic arms production improves our army's offensive capability."
  modifier_yettishar_artillery_bonus:0 "Modern Artillery Batteries"
  modifier_yettishar_professional_army_bonus:0 "Professional Steppe Soldier Discipline"
  modifier_yettishar_professional_army_bonus_desc:0 "Abolishing peasant levies in favor of a professional army improves combat performance and organization."
  modifier_yettishar_british_rifles_bonus:0 "British Martini-Henry Rifles"
  modifier_yettishar_british_rifles_bonus_desc:0 "Modern breech-loading rifles purchased from Britain improve our army's offense and defense."
  modifier_yettishar_ottoman_officers_bonus:0 "Ottoman Military Drill Mission"
  modifier_yettishar_ottoman_officers_bonus_desc:0 "Ottoman drill instructors improve our army's offense and defense."
  modifier_yettishar_ottoman_mission_debuff:0 "Officers Abroad"
  modifier_yettishar_ottoman_mission_debuff_desc:0 "Sending officers and a guarantee pact abroad strains the Sublime Porte's prestige."
  modifier_yettishar_british_mission_debuff:0 "Arms Export Scrutiny"
  modifier_yettishar_british_mission_debuff_desc:0 "Selling modern rifles to a minor power draws unwanted scrutiny at home."
