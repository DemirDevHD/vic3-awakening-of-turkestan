  btn_yettishar_kamil_khwarezmi_name:0 "Hive'den Kamil Harezmi'yi Davet Et"
  btn_yettishar_kamil_khwarezmi_desc:0 "Hive Hanlığı Rus işgaline uğradığında veya bağımsızlığını yitirdiğinde, matbaacı ve aydın Kamil Harezmi Kaşgar'a davet edilir. Aydınlar grubunun lideri olur ve reformlara öncülük eder."
  btn_yettishar_military_reform_start_name:0 "Nizami Ordu ve Askeri Reformu Başlat"
  btn_yettishar_military_reform_start_desc:0 "Sivil modernleşmenin yanı sıra ordumuzu bozkır süvarileri yapısından çıkarıp Avrupa ve Osmanlı standartlarında profesyonel bir Nizami Ordu haline getirmek için askeri reform sürecini başlatabiliriz."
  btn_yettishar_british_rifles_name:0 "Forsyth Misyonu ve Martini-Henry Alımı"
  btn_yettishar_british_rifles_desc:0 "Londra veya Hindistan Genel Valiliği ile diplomatik temas kurarak (İlişki >= 30) ve hazinemizden 10.000 altın harcayarak orduya binlerce Martini-Henry yivli tüfeği sevk edebiliriz. Bu hamle hem ikmal verimliliğimizi artıracak hem de arkadan dolmalı tüfek teknolojisine büyük bir sıçrama (+1500 ilerleyiş) kazandıracaktır."
  btn_yettishar_ottoman_officers_name:0 "Dersaadet'le Askeri Antlaşma ve Zabit Heyeti"
  btn_yettishar_ottoman_officers_desc:0 "Dersaadet ile ilişkilerimizi güçlendirerek (İlişki >= 30) askeri heyet ve destek antlaşması imzalayabiliriz. Osmanlı hem bağımsızlığımızı garanti edecek hem de ordumuza düzenli para (Haftalık 1000 Altın) ve mühimmat desteği aktaracaktır."
  btn_yettishar_foreign_relations_name:0 "Dış İlişkiler"
  btn_yettishar_foreign_relations_desc:0 "Büyük devletlerle diplomatik misyonları açar."
  btn_yettishar_turkestan_hakimiyet_name:0 "Türkistan'ın Hakimiyeti"
  btn_yettishar_turkestan_hakimiyet_desc:0 "İstikbal tamamlanmış, Pan-milliyetçilik araştırması bitmiş ve Tebaalık yasası olmamalıdır."
  btn_yettishar_turkestan_istikbal_name:0 "Türkistan'ın İstikbali"
  btn_yettishar_turkestan_istikbal_desc:0 "Milliyetçilik gerektirir. İstikbal günlük kaydını açar."

