  modifier_hokand_irrigation_dispute_desc:0 "Disputes over water rights in the Fergana Valley are stirring rural unrest."
  modifier_hokand_russian_recon:0 "Border Alert & Vigilance"
  modifier_hokand_russian_recon_desc:0 "The army is on high alert following Russian reconnaissance along the northern frontier."
