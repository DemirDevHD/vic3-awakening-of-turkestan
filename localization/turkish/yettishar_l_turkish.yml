 turkmen_issue_events.1.t:0 "Aşiret İkna Görüşmeleri"
 turkmen_issue_events.1.d:0 "Teke, Yomut ve Ersari elçileri karışık yanıtlarla dönüyor. Onları bayrağımıza bağlamak Türkmen Meselesini ilerletecek."
 turkmen_issue_events.1.f:0 "Akrabalık ile korku aynı bozkır yolunda yürür."
 turkmen_issue_events.1.a:0 "İhtiyarları hediyelerle ve vaatlerle kazan"
 turkmen_issue_events.1.b:0 "İhtiyarlarla kısmi bir uzlaşma yap"
 turkmen_issue_events.1.c:0 "Görüşmelerin çökmesine izin ver"

 turkmen_issue_events.2.t:0 "Göçebe Direnişi"
 turkmen_issue_events.2.d:0 "Göçebe birlikleri vergiyi reddedip devriyelere karşı geliyor. Yanıtınız hem düzeni hem ilerlemeyi belirleyecek."
 turkmen_issue_events.2.f:0 "Bozkır mücadele olmadan boyun eğmez."
 turkmen_issue_events.2.a:0 "Göçebeleri orduyla bastır"
 turkmen_issue_events.2.b:0 "Aşiret reisleriyle barış pazarlığı yap"
 turkmen_issue_events.2.c:0 "Yumuşak bir tutum benimse"

 turkmen_issue_events.10.t:0 "Teke Pazarlığı"
 turkmen_issue_events.10.d:0 "Teke büyükleri kendi şartlarıyla tanınma sunuyor. Kabul ilerletir; red radikal riski taşır."
 turkmen_issue_events.10.f:0 "Sadakatten önce sözler serilir."
 turkmen_issue_events.10.a:0 "Pazarlığı kabul et ve devam et"
 turkmen_issue_events.10.b:0 "Reddet ve gerginliğin artmasına izin ver"

 turkmen_issue_events.11.t:0 "Yomut Otlakları"
 turkmen_issue_events.11.d:0 "Yomut otlak anlaşmazlığı yerel düzeni tehdit ediyor. Çözmek hem iyiniyet hem ilerleme kazandırır."
 turkmen_issue_events.11.f:0 "Ot da şan da kıt."
 turkmen_issue_events.11.a:0 "Otlak anlaşmazlığını barışçıl çöz"
 turkmen_issue_events.11.b:0 "Huzursuzluğu şimdilik görmezden gel"

 turkmen_issue_events.12.t:0 "Kervan Yağması"
 turkmen_issue_events.12.d:0 "Çöl yolunda bir kervan yağmalandı. Yolları sıkılaştırmak düzeni sağlar ve Alaman yasağını hatırlatır."
 turkmen_issue_events.12.f:0 "Alaman gölgesi akşamda uzar."
 turkmen_issue_events.12.a:0 "Kervan yolları boyunca devriyeleri sıklaştır"

 turkmen_issue_events.13.t:0 "Pers Şikâyeti"
 turkmen_issue_events.13.d:0 "İran sınır yağmalarını protesto ediyor. Hafif özür ilişki pahasına; Alaman yasağına yönelmek az ilerleme verir."
 turkmen_issue_events.13.f:0 "Tahran çöl kenarını izliyor."
 turkmen_issue_events.13.a:0 "Tahran'a hafif bir özür sun"
 turkmen_issue_events.13.b:0 "Alaman baskınlarının yasaklanmasına işaret et"

 turkmen_issue_events.14.t:0 "Göçebe Düğünü"
 turkmen_issue_events.14.d:0 "Büyük bir aşiret düğünü kapıları açıyor. Hediye ve elçiler misafirperverliği siyasî bağlılığa çevirebilir."
 turkmen_issue_events.14.f:0 "Misafirperverlik çeliğin bağlayamadığını bağlayabilir."
 turkmen_issue_events.14.a:0 "Konaklara hediyeler ve elçiler gönder"

 turkmen_issue_events.16.t:0 "Koloni Bürosu Raporu"
 turkmen_issue_events.16.d:0 "Kâtipler Türkmen topraklarında sömürge idaresini raporluyor. Sömürge İşleri varsa rapor çok daha işe yarar."
 turkmen_issue_events.16.f:0 "Mürekkep, sancakların beklediği yerde ilerler."
 turkmen_issue_events.16.a:0 "Koloni bürosunun raporunu incele"

