  yettishar_events.101.d:0 "Hive Hanlığı artık mevcut değilken Kamil Harezmi Kaşgar'a davet edildi. Matbaası ve reformist fikirleriyle Aydınlar grubunun başına geçerek devletin modernleşmesine öncülük etmeye hazır."
