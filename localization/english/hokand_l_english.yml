# --- CHARACTER NAMES ---
  Murad_Beg:0 "Murad Beg"
  Murat_Beg:0 "Murat Beg"
  Murad_Beg_desc:0 "Murad Beg, son of Alim Khan, is a puppet ruler placed on the throne amid palace intrigue and regional unrest. Weak and easily overshadowed, he clings to a trembling throne rather than governing the realm."
# --- EVENTS: MAIN NARRATIVE (1-6, 35) ---
  hokand_events.1.t:0 "Assassination in Our Court & the Void of Authority"
  hokand_events.1.d:0 "In 1842, even as Bukhara's Emir Nasrullah withdrew his forces, conspirators and Bukharan collaborators within our palace carried out a horrific assassination. Members of our royal Ming dynasty were slaughtered, leaving the puppet Murad Beg to ascend the throne as the sole surviving heir. While our divan reels from the shock, our commander Yakub Beg has begun rising rapidly in the background, gaining the respect of the army's officers."
  hokand_events.1.f:0 "The blood on the throne room floor has not yet dried. Murad Beg clings to a trembling throne while, across the divan, the footsteps of Yakub Beg echo ever louder."
  hokand_events.1.a:0 "The struggle for the throne begins in earnest."
  hokand_events.2.t:0 "Atalik Ghazi Yakub Beg Seizes Control"
  hokand_events.2.d:0 "As the throne's authority collapsed completely, our commander Yakub Beg rallied overwhelming support from the military and the Tashkent nobility to seize control of the government. The helpless puppet Murad Beg stepped down, and Yakub Beg, assuming the title of Atalik Ghazi, took the reins as absolute ruler of our state."
  hokand_events.2.f:0 "A new power now commands the Fergana Valley."
  hokand_events.2.a:0 "Long live the Atalik Ghazi!"
  hokand_events.3.t:0 "Birth of the Yettishar State"
  hokand_events.3.d:0 "Having consolidated authority over Kokand and secured our eastern realms, Yakub Beg proclaims a new state centered on East Turkestan and the city of Kashgar: the Khanate of Yettishar."
  hokand_events.3.f:0 "From the Tianshan Mountains to the Tarim Basin, a single banner now flies."
  hokand_events.3.a:0 "Proclaim the new state of Yettishar."
  hokand_events.4.t:0 "Intrigues in Our Divan"
  hokand_events.4.d:0 "Factions within our royal court are taking advantage of the weak Khan to demand new concessions and privileges from the throne."
  hokand_events.4.f:0 "Politics is a field far more dangerous than the battlefield."
  hokand_events.4.a:0 "We must tread carefully."
  hokand_events.5.t:0 "A Rising Power in Our Army"
  hokand_events.5.d:0 "The balance of prestige among our military officers and subjects is shifting rapidly."
  hokand_events.5.f:0 "A new star rises as the old order shakes."
  hokand_events.5.a:0 "Let us watch developments closely."
  hokand_events.6.t:0 "Dead End of the Ming Dynasty"
  hokand_events.6.d:0 "The Khan's court has fully reasserted its authority, and Yakub Beg's bid for power has collapsed before it could mature. The puppet Murad Beg remains on the throne, but the realm now settles into a paralyzed, reactionary order. All paths toward reform are closed."
  hokand_events.6.f:0 "An opportunity for national salvation has slipped through our fingers. Kokand is now merely a shadow of its former glory."
  hokand_events.6.a:0 "We enter a dark and stagnant era."
  hokand_events.35.t:0 "Atalik Ghazi's First Decrees"
  hokand_events.35.d:0 "Now ruling as Atalik Ghazi, Yakub Beg issues his first decrees from the Kokand palace, confirming his officers' ranks and courting the merchant nobility of Tashkent to steady his new government."
  hokand_events.35.f:0 "A soldier's throne must be built as carefully as any dynasty's."
  hokand_events.35.a:0 "Issue the first decrees of our new rule."
# --- EVENTS: VOID OF AUTHORITY COURT CRISES (10-19) ---
# --- VOID OF AUTHORITY RANDOM EVENT OPTION BAR EFFECTS ---
  hokand_void_event_court_bars_tt:0 "• Khan Authority #G+15#!\n• Uzbek & Military Support (Yakub Beg) #R-10#!"
  hokand_void_event_yakub_bars_tt:0 "• Uzbek & Military Support (Yakub Beg) #G+15#!\n• Khan Authority #R-10#!"
  hokand_void_followup_court_bars_tt:0 "• Khan Authority #G+6#!\n• Uzbek & Military Support (Yakub Beg) #R-6#!"
  hokand_void_followup_yakub_bars_tt:0 "• Uzbek & Military Support (Yakub Beg) #G+6#!\n• Khan Authority #R-6#!"
  hokand_events.10.t:0 "The Tax Caravan from Tashkent"
  hokand_events.10.d:0 "The governor of Tashkent and local notables have refused to dispatch this year's tax caravan to the capital, redirecting the revenues directly to army needs. Taking advantage of court weakness, these feudal lords are openly backed by army commander Yakub Beg. In our divan, viziers are anxious: either we take strict measures to defend court authority and treasury, or we step back against this de facto military move."
  hokand_events.10.f:0 "As the royal treasury empties, the palace walls tremble and the soldier's sword shines."
  hokand_events.10.a:0 "Seize the caravan; assert the crown's tax rights. (Khan Authority +15, Yakub Support -10)"
  hokand_events.10.b:0 "Let Yakub Beg's officers claim the caravan revenues. (Yakub Support +15, Khan Authority -10)"
  hokand_events.11.t:0 "Memorandum of the Kipchak Tribes"
  hokand_events.11.d:0 "Kipchak warlords entered the divan demanding the removal of Yakub Beg's modern officers. We must either grant tribal privileges to secure the throne or trust our military officers."
  hokand_events.11.f:0 "The ancient struggle between steppe riders and officers spills into court."
  hokand_events.11.a:0 "Grant the Kipchaks tribal privileges to secure the throne. (Khan Authority +15, Yakub Support -10)"
  hokand_events.11.b:0 "Stand by Yakub Beg's officers against tribal demands. (Yakub Support +15, Khan Authority -10)"
  hokand_events.12.t:0 "Gold Chests of the Bukharan Envoy"
  hokand_events.12.d:0 "A Bukharan envoy offered gold to the court on condition that Yakub Beg be dismissed. The court can secure its throne with this gold, but the army will be furious at foreign intervention."
  hokand_events.12.f:0 "Gold from an enemy is a henna-stained dagger."
  hokand_events.12.a:0 "Accept Bukhara's gold to reinforce the court's throne. (Khan Authority +15, Yakub Support -10)"
  hokand_events.12.b:0 "Reject the bribe to placate Yakub Beg's furious officers. (Yakub Support +15, Khan Authority -10)"
  hokand_events.13.t:0 "Sermon of the Ulema in Divan"
  hokand_events.13.d:0 "Traditionalist ulema defending court legitimacy clashed with reformist sheikhs supporting Yakub Beg's jihad. The court must either back its ulema or watch the army's spiritual wave prevail."
  hokand_events.13.f:0 "Voices from the pulpits shape the allegiance of the realm."
  hokand_events.13.a:0 "Back the traditionalist ulema defending court legitimacy. (Khan Authority +15, Yakub Support -10)"
  hokand_events.13.b:0 "Let reformist sheikhs bless Yakub Beg's jihad. (Yakub Support +15, Khan Authority -10)"
  hokand_events.14.t:0 "Salary Ultimatum from Akmechet Garrison"
  hokand_events.14.d:0 "Yakub Beg reports border soldiers are near mutiny over unpaid wages, demanding immediate gold or direct control over fortress customs revenues."
  hokand_events.14.f:0 "A frontier soldier's patience cracks faster than fortress walls."
  hokand_events.14.a:0 "Pay the garrison's wages directly from the treasury. (Khan Authority +15, Yakub Support -10)"
  hokand_events.14.b:0 "Grant Yakub Beg control of fortress customs revenue. (Yakub Support +15, Khan Authority -10)"
  hokand_events.15.t:0 "Security of Fergana Trade Routes"
  hokand_events.15.d:0 "While bandit gangs pillage caravans in the Fergana Valley, the inadequacy of royal guards has driven merchants to the brink of rebellion. Seizing the opening, Yakub Beg took control of the highways with his own cavalry and now demands recognition as sole protector of the trade routes."
  hokand_events.15.f:0 "A realm with severed trade arteries resembles a dying body."
  hokand_events.15.a:0 "Order royal guards to reclaim the trade routes. (Khan Authority +15, Yakub Support -10)"
  hokand_events.15.b:0 "Cede the highways to Yakub Beg's cavalry. (Yakub Support +15, Khan Authority -10)"
  hokand_events.16.t:0 "Border Dispute with Khiva"
  hokand_events.16.d:0 "When Khivan riders raided our border tribes, the court planned only a diplomatic protest — until Yakub Beg's officers burst into the divan. They declared that border honor cannot be defended with paper alone and demanded immediate military action."
  hokand_events.16.f:0 "A concession made at the border stone is a concession made at the palace gate."
  hokand_events.16.a:0 "Reject the officers' unilateral march; protest through diplomacy. (Khan Authority +15, Yakub Support -10)"
  hokand_events.16.b:0 "Let Yakub Beg's officers march against the Khivans. (Yakub Support +15, Khan Authority -10)"
  hokand_events.17.t:0 "The Shadow of Warlord Musulmankul"
  hokand_events.17.d:0 "The ruthless Kipchak warlord Musulmankul strode into our court, openly blackmailing Murad Beg. Demanding the banishment of young officers loyal to his rival Yakub Beg, Musulmankul threatened that steppe tribes would besiege the capital if refused."
  hokand_events.17.f:0 "If the central pillar of the palace bends, the roof collapses upon the dynasty."
  hokand_events.17.a:0 "Buy peace with Musulmankul to protect the throne. (Khan Authority +15, Yakub Support -10)"
  hokand_events.17.b:0 "Let the army confront Musulmankul's steppe threat. (Yakub Support +15, Khan Authority -10)"
  hokand_events.18.t:0 "The Extortionist Governor and Merchants"
  hokand_events.18.d:0 "When our governor in Khujand began levying illegitimate taxes, urban merchants revolted. While the court tried to shield the governor, Yakub Beg intervened, backing the merchant notables and demanding his immediate dismissal."
  hokand_events.18.f:0 "A governor who robs subjects with a sword is undermining the Khan's throne."
  hokand_events.18.a:0 "Shield the governor and keep his tax revenues. (Khan Authority +15, Yakub Support -10)"
  hokand_events.18.b:0 "Dismiss the governor at Yakub Beg's demand. (Yakub Support +15, Khan Authority -10)"
  hokand_events.19.t:0 "Tactical Reform in the Royal Arsenal"
  hokand_events.19.d:0 "Yakub Beg and his reformist young officers have presented a memorandum demanding de facto control of the archaic royal gunpowder vaults and artillery foundries."
  hokand_events.19.f:0 "A fortress that closes its gates to innovation is inviting the enemy inside."
  hokand_events.19.a:0 "Reject the officers; keep the arsenal under guard control. (Khan Authority +15, Yakub Support -10)"
  hokand_events.19.b:0 "Let Yakub Beg's army modernize the royal arsenals. (Yakub Support +15, Khan Authority -10)"
# --- EVENTS: VOID OF AUTHORITY FOLLOW-UP CHAIN (20-22) ---
  hokand_events.20.t:0 "The Tashkent Governor's Mutiny Threat"
  hokand_events.20.d:0 "Enraged by the diversion of Tashkent tax revenues to garrisons, the governor threatens to halt all grain and tax shipments, backed by conservative nobility. The court will either immediately dismiss the governor to assert authority or allow army officers to de facto crush this rebellion."
  hokand_events.20.f:0 "The political wind sown months ago returns to the palace as a roaring storm."
  hokand_events.20.a:0 "Dismiss the governor; no defiance against court authority will be tolerated! (Khan Authority +6, Yakub Support -6)"
  hokand_events.20.b:0 "Yakub Beg's officers crushed the governor's rebellion threat and secured the revenues! (Yakub Support +6, Khan Authority -6)"
  hokand_events.21.t:0 "Warlord Musulmankul's Kipchaks Block the Highways!"
  hokand_events.21.d:0 "Enraged by the rejection of privileges, Kipchak warlord Musulmankul has blockaded Khujand roads with thousands of horsemen, demanding Yakub Beg be stripped of authority. The court will either negotiate with tribes to defend its authority or watch Atalik Ghazi's cavalry forcefully break the blockade."
  hokand_events.21.f:0 "When the horsemen of the steppe draw their swords, silence falls over the Fergana Valley."
  hokand_events.21.a:0 "Negotiate with the tribes; let us defend Khanate authority through diplomacy! (Khan Authority +6, Yakub Support -6)"
  hokand_events.21.b:0 "Atalik Ghazi's cavalry broke the blockade; the tribes retreated. (Yakub Support +6, Khan Authority -6)"
  hokand_events.22.t:0 "Autonomous Garrison Authority in Ak-Mechet"
  hokand_events.22.d:0 "Having secured control of customs revenues, Yakub Beg transformed Ak-Mechet into a military bastion where officers salute only Atalik Ghazi. The court will either dispatch financial inspectors to establish oversight or accept this de facto garrison autonomy."
  hokand_events.22.f:0 "The lion raised on the border will one day knock upon the palace gate."
  hokand_events.22.a:0 "Dispatch inspectors to bring customs revenue under court oversight. (Khan Authority +6, Yakub Support -6)"
  hokand_events.22.b:0 "Accept the garrison's de facto autonomy from the palace. (Yakub Support +6, Khan Authority -6)"
# --- SECURING AUTHORITY RANDOM EVENT OPTION BAR EFFECTS ---
  hokand_secure_event_fergana_bars_tt:0 "• Fergana Authority #G+15#!"
  hokand_secure_event_nomad_bars_tt:0 "• Nomadic Tribal Support #G+15#!"
# --- EVENTS: SECURING AUTHORITY FLAVOR EVENTS (40-49) ---
  hokand_events.40.t:0 "Bazaar Tax Dispute in Andijan"
  hokand_events.40.d:0 "Merchants in Andijan's grand bazaar refuse to pay the new market levy, backed by local qadis wary of court overreach. Yakub Beg's officers stand ready to enforce the tariff by force."
  hokand_events.40.f:0 "Copper coins and cotton bales pile up unweighed at the scales."
  hokand_events.40.a:0 "Enforce the levy and garrison the bazaar gates. (Fergana Authority +15)"
  hokand_events.40.b:0 "Waive the levy to keep rural peace. (Nomadic Tribal Support +15)"
  hokand_events.41.t:0 "Kipchak Chieftains at the Divan"
  hokand_events.41.d:0 "Kipchak chieftains arrive at court demanding recognition of their pasture rights, while palace scribes press for direct tax collection across their lands."
  hokand_events.41.f:0 "Felt tents and marble halls rarely speak the same language."
  hokand_events.41.a:0 "Recognize the chieftains' ancestral pasture rights. (Nomadic Tribal Support +15)"
  hokand_events.41.b:0 "Send collectors to tax the chieftains' herds. (Fergana Authority +15)"
  hokand_events.42.t:0 "Dispute Over Kyrgyz Grazing Lands"
  hokand_events.42.d:0 "Fergana landowners petition the court to reclaim grazing lands settled by Kyrgyz herders, threatening open conflict if the palace does not intervene."
  hokand_events.42.f:0 "A boundary stone means little to a herd on the move."
  hokand_events.42.a:0 "Restore the grazing lands to Fergana landowners. (Fergana Authority +15)"
  hokand_events.42.b:0 "Confirm Kyrgyz claims and tax the herds instead. (Nomadic Tribal Support +15)"
  hokand_events.43.t:0 "Waqf Endowments in Fergana"
  hokand_events.43.d:0 "Ulema administrators seek treasury funding to restore Fergana's madrasas and waqf lands, while nomadic elders ask that the same gold be spent on tribal grain relief."
  hokand_events.43.f:0 "Faith and famine both demand the treasury's attention."
  hokand_events.43.a:0 "Fund the madrasas and waqf restorations. (Fergana Authority +15)"
  hokand_events.43.b:0 "Send the grain relief to tribal elders instead. (Nomadic Tribal Support +15)"
  hokand_events.44.t:0 "Customs Post at the Terek Pass"
  hokand_events.44.d:0 "A new customs post at the mountain pass could fill the treasury from Fergana caravans, but nomadic clans see it as a toll on their ancient migration routes."
  hokand_events.44.f:0 "Every stone fort on the pass casts a long shadow."
  hokand_events.44.a:0 "Build the customs post and tax the caravans. (Fergana Authority +15)"
  hokand_events.44.b:0 "Grant the clans free passage through the pass. (Nomadic Tribal Support +15)"
  hokand_events.45.t:0 "Silk Weavers' Petition in Kokand"
  hokand_events.45.d:0 "Kokand's silk weavers ask the court to underwrite new looms, while Kipchak traders request the same funds to secure caravan escorts across the steppe."
  hokand_events.45.f:0 "Thread and horsehair rope pull at the same purse."
  hokand_events.45.a:0 "Underwrite the silk weavers' new looms. (Fergana Authority +15)"
  hokand_events.45.b:0 "Fund caravan escorts for the steppe traders. (Nomadic Tribal Support +15)"
  hokand_events.46.t:0 "Court Petition on Irrigation Rights"
  hokand_events.46.d:0 "Fergana canal overseers demand the court enforce their water rights against upstream nomadic herds, who claim equal access to the valley's irrigation channels."
  hokand_events.46.f:0 "In a dry valley, water is worth more than gold."
  hokand_events.46.a:0 "Enforce the canal overseers' exclusive water rights. (Fergana Authority +15)"
  hokand_events.46.b:0 "Grant herders equal access to the canals. (Nomadic Tribal Support +15)"
  hokand_events.47.t:0 "Guild Dispute Over Caravan Tolls"
  hokand_events.47.d:0 "Fergana's craft guilds demand the court fund new caravanserai along the Silk Road, while tribal escorts ask for a share of the toll revenue instead."
  hokand_events.47.f:0 "Every mile of road has its own claimants."
  hokand_events.47.a:0 "Fund new caravanserai for the craft guilds. (Fergana Authority +15)"
  hokand_events.47.b:0 "Share the toll revenue with tribal escorts. (Nomadic Tribal Support +15)"
  hokand_events.48.t:0 "Governor's Tax Rolls in Khujand"
  hokand_events.48.d:0 "The Khujand governor's new tax rolls squeeze both urban merchants and tribal traders; the court must decide whose burden to lighten first."
  hokand_events.48.f:0 "A ledger balanced on one side tips over on the other."
  hokand_events.48.a:0 "Tighten oversight of the governor's tax rolls. (Fergana Authority +15)"
  hokand_events.48.b:0 "Grant tribal traders exemption from the new rolls. (Nomadic Tribal Support +15)"
  hokand_events.49.t:0 "Garrison Drills Along the Frontier"
  hokand_events.49.d:0 "Frontier garrisons request funds for winter drills to hold the Fergana line, while nomadic auxiliaries ask that the same gold be paid as overdue stipends."
  hokand_events.49.f:0 "Discipline and loyalty both have their price in gold."
  hokand_events.49.a:0 "Fund winter drills for the frontier garrisons. (Fergana Authority +15)"
  hokand_events.49.b:0 "Pay overdue stipends to the nomadic auxiliaries. (Nomadic Tribal Support +15)"
# --- EVENTS: SECURING AUTHORITY BUTTON EVENTS (50-55) ---
  hokand_events.50.t:0 "Bringing the Fergana Beys to Heel"
  hokand_events.50.d:0 "With the treasury's gold already spent to summon them, the Fergana beys now stand before the divan awaiting judgment. How harshly the court presses its new authority will shape their loyalty for years to come."
  hokand_events.50.f:0 "Gold opens the door; only will decides what follows."
  hokand_events.50.a:0 "Strip the beys of their remaining privileges outright."
  hokand_events.50.b:0 "Confirm their titles in exchange for open loyalty."
  hokand_events.51.t:0 "Sharia Endorsement of the Fergana Ulema"
  hokand_events.51.d:0 "The Naqshbandi ulema of Fergana offer their religious endorsement of the court's authority, but their price differs sharply depending on how far the palace will bend to their demands."
  hokand_events.51.f:0 "A fatwa carries more weight than a hundred soldiers."
  hokand_events.51.a:0 "Impose sharia courts over the ulema's objections."
  hokand_events.51.b:0 "Endow their madrasas in exchange for blessing."
  hokand_events.52.t:0 "Treaty with Alimbek Datka"
  hokand_events.52.d:0 "Alimbek Datka, chief of the Kyrgyz and Kipchak clans, offers to bind his warriors to the throne. A full alliance costs the treasury dearly, while a lighter pact wins far less devotion."
  hokand_events.52.f:0 "A steppe chief's word is worth exactly what is paid for it."
  hokand_events.52.a:0 "Pay Alimbek's full price for lasting loyalty."
  hokand_events.52.b:0 "Accept a modest pact and lesser devotion."
  hokand_events.53.t:0 "Mobilizing the Frontier Cavalry"
  hokand_events.53.d:0 "Nomadic horsemen offer to ride hard against raiders along the frontier. An aggressive campaign wins deep tribal gratitude but unsettles the settled valleys behind them."
  hokand_events.53.f:0 "Hooves raise more dust than they settle."
  hokand_events.53.a:0 "Unleash the cavalry on the raiders at once."
  hokand_events.53.b:0 "Deploy the cavalry only along the border."
  hokand_events.54.t:0 "Rebel Camps in the Fergana Hills"
  hokand_events.54.d:0 "Rebellious clansmen have gathered in mountain camps beyond the valley. Crushing them outright wins the tribes' fear and loyalty, while paying them off buys a quieter peace."
  hokand_events.54.f:0 "The mountains keep their own counsel on such matters."
  hokand_events.54.a:0 "Storm the camps and crush the rebels outright."
  hokand_events.54.b:0 "Pay the rebels to disperse quietly."
  hokand_events.55.t:0 "Strengthening the Border Patrols"
  hokand_events.55.d:0 "Alimbek's tribal riders and Fergana's garrisons can jointly watch the frontier, but a full year of patrols costs far more than a shorter deployment."
  hokand_events.55.f:0 "A watched border sleeps easier than an open one."
  hokand_events.55.a:0 "Fund a full year of joint border patrols."
  hokand_events.55.b:0 "Fund a shorter season of border patrols."
  Murat_Beg_desc:0 "Murat Beg, son of Alim Khan, is known as a puppet ruler. Placed on the throne amid his father's decline and regional unrest, his hold is fragile. Caught between palace intrigue and the rising army, he clings to survival rather than governing."
  hokand_annex_uzh_decision:0 "Annexation of the Senior Juz (Zhetysu)"
  hokand_annex_uzh_decision_desc:0 "Consolidate ties with the Senior Juz and incorporate them into our realm against Russian encroachment."
  hokand_diplomacy_cooldown_tt:0 "The cooldown for this action has not yet expired."
  je_hokand_secure_authority_desc:0 "The Khanate of Kokand must end internal chaos and unite under a single central administration. As tax control in Fergana and loyalty among Kipchak cavalry are secured, the state will safeguard its sovereignty."
  je_hokand_void_of_authority_desc:0 "Central authority is under severe pressure from the garrisons and Kipchak begs. The struggle will continue until either the Khan's court or Yakub Beg's military faction prevails."
