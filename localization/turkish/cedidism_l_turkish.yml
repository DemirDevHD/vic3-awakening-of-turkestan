 ideology_cedidism:0 "Cedidcilik"

 ideology_cedidism_desc:0 "Devlet okulları, zorunlu eğitim, vicdan özgürlüğü ile kölelik ve serfliğin kaldırılmasını savunan; gelenekselciliğe karşı müdahaleci modernleşmeyi benimseyen Türk reformcu ideolojisi."

 ideology_cedidist_movement:0 "Cedidcilik"

 ideology_cedidist_movement_desc:0 "Devlet okulları, vicdan özgürlüğü, müdahaleci modernleşme ile serflik ve köleliğin sona ermesini talep eden eğitimciler, katipler ve reformcu aydınlar."

