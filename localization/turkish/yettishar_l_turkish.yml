 btn_istikbal_uyghur_path_name:0 "Uygur Yolunu Güvenceye Al"
 btn_istikbal_uyghur_path_desc:0 "Kaşgar kişisel birlik altındaki tabi devletinizse ilhak edin veya Tanrı Dağları ile Çungarya kontrolünü teyit edin. Bölünmüş Uygur toprak payları sizin altınızda birleşir ve Uygur birincil kültür olarak eklenir."
 istikbal_uyghur_unify_tt:0 "Tanrı Dağları, Çungarya ve Yedisu'daki bölünmüş paylar sizin altınızda birleşir"
 btn_istikbal_open_turkmenistan_name:0 "Türkmenistan Meselesini Aç"
 btn_istikbal_open_turkmenistan_desc:0 "İstikbal kapsamında Türkmen meselesini çözmeye başlayın."

 btn_turkmen_persuade_people_name:0 "Halk ve Aşiretleri İkna Et"
 btn_turkmen_persuade_people_desc:0 "Teke, Yomut ve Ersari'ye elçi gönderir. Başarı +18 ilerleme; kısmi pazarlık +10 (biraz radikal); çöküş yalnızca radikal. 90 gün bekleme."
 btn_turkmen_nomad_crisis_name:0 "Göçebe Direnişiyle Yüzleş"
 btn_turkmen_nomad_crisis_desc:0 "Vergi reddi ve devriye karşıtlığını çözer. Sert bastırma +20 ve geçici askeri bonus; pazarlık +12; yumuşak yol +6 ve radikal. 90 gün bekleme."
 btn_turkmen_colonization_war_name:0 "Kolonizasyon Savaşı Başlat"
 btn_turkmen_colonization_war_desc:0 "Türkmenistan'a karşı Harezm + Uralsk diplomatik oyunu açar. Zafer +40 ilerleme. Yenilgi: 365 gün bekleme."
 btn_turkmen_ban_alaman_name:0 "Alaman Yağmalarını Yasakla"
 btn_turkmen_ban_alaman_desc:0 "Tek seferlik. +25 ilerleme, İran ile +15 ilişki, 24 ay Kervan Koruması; alt tabakada radikal artışı."

 btn_hakimiyet_proclaim_turkestan_name:0 "Türkistan'ı İlan Et"
 btn_hakimiyet_proclaim_turkestan_desc:0 "Kültürel birlik sonrası en az 9/17 çekirdek eyaleti tutuyorsanız ülkeyi Türkistan (TRH) olarak ilan eder; Türkmen birincil kültür ekler; şahsi birlik Türkmenistan varsa ilhak eder. 5 yıllık otorite/bürokrasi/asimilasyon bonusu ve Sibirya/Hazar iddiaları verir. Kazak ve Hazara birincil kültür eklemez."
 btn_hakimiyet_kazakh_path_name:0 "Kazak İkna Yolu"
 btn_hakimiyet_kazakh_path_desc:0 "Kazak bozkırını ikna ve ordu yoluyla bağlar. Aktobe, Akmola, Semireçye, Syr Darya ve Uralsk iddiaları açar; Sadık Sultan ve süvari ordusu ile tamamlanır."
 btn_hakimiyet_centralize_name:0 "Türkistan'ı Merkezileştir"
 btn_hakimiyet_centralize_desc:0 "İlan sonrası İçişleri ≥3, serflik/gelenekçilik/sanayi yasağı yok, kapalı çarşı veya pasaj ve en az 8 demiryolu seviyesi gerektiren merkezileştirme günlük kaydını açar."

 je_greater_turkestan:0 "Büyük Türkistan"
 je_greater_turkestan_reason:0 "Aktobe, Akmola ve Sırderya'yı tutarak Büyük Türkistan'ı açın; Tartaria, Ural, Tomsk, Tobolsk, Astrahan ve Çeboksarı ile birleştirin; küreyi kırın, sonra Rus sürgünü (veya atla), sonra İdil-Ural birincilleri. Tamamlanınca sahip olunan listedeki eyaletlerde Rus anavatanı Tatar ile değişir."
 je_greater_turkestan_status:0 "Aktobe üçlüsü açar; sıra: küre → sürgün/atla → İdil-Ural; tamamlamak için Astrahan ve Çeboksarı; bitince anavatan değişimi."
