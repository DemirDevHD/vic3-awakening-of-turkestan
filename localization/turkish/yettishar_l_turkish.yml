 btn_yettishar_send_heir_to_porte_name:0 "Veliahtı Babıali'ye Gönder"
 btn_yettishar_send_heir_to_porte_desc:0 "Beg Kuli Beg'i Babıali'de eğitim için İstanbul'a gönderir. Osmanlı ilişkileri >= 30, yıl 1865+ ve Beg Kuli'nin veliaht olması gerekir. 5000£ maliyeti vardır; 24 ay sonra döner."
