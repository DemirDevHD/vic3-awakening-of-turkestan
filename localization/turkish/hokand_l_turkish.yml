# --- HOKAND KARARI: ULU CÜZ İLHAKI ---
  hokand_annex_uzh_decision:0 "Ulu Cüz'ün (Yedisu) İlhak Edilmesi"
  hokand_annex_uzh_decision_desc:0 "Rusya'nın himayesindeki Ulu Cüz ile ilişkilerimizi pekiştirip topraklarını hanlığımıza katalım."
# --- KARAKTER İSİMLERİ ---
  Murat_Beg:0 "Murat Beg"
  Murat_Beg_desc:0 "Murat Beg, Alim Han'ın oğlu ve kukla han olarak bilinir. Babasının zayıflaması ve bölgedeki karışıklıklar yüzünden tahta çıkarılmış olsa da yönetimi son derece kırılgan. Saray entrikaları ile ordunun yükselen gücü arasında sıkışıp kalmış; devleti yönetmekten çok titreyen tahtında hayatta kalmaya çalışan aciz bir hükümdar."
# --- OLAYLAR (SARAY VE HANLIK GÖZÜNDEN YAZILMIŞ ANLATIM: 1-6) ---
  hokand_events.1.t:0 "Suikast ve Otorite Boşluğu"
  hokand_events.1.d:0 "1842'de Buhara Emiri Nasrullah ordularını geri çekmiş olsa da sarayımızdaki Buharalı işbirlikçiler korkunç bir suikast düzenledi! Ming hanedanının mensupları katledildi, tahtta yalnızca kukla Murat Beg kaldı. Saray şoku atlatamazken komutanımız Yakub Beg, subaylar arasında hızla itibar kazanarak arka planda yükseliyor."
  hokand_events.1.f:0 "Taht odasının zemininde henüz kurumamış kan var... Murat Beg titreyen tahtına umutsuzca tutunurken, divanda Yakub Beg'in ayak sesleri yankılanıyor."
  hokand_events.1.a:0 "Hokand Hanlığı'nın kaderi bu fırtınada şekillenecek!"
  hokand_events.2.t:0 "Atalık Gazi Yakub Beg Yönetimi Ele Geçiriyor!"
  hokand_events.2.d:0 "Han'ın otoritesi tamamen çöktü; Yakub Beg, ordu ve Taşkent eşrafından aldığı ezici destekle yönetimi ele geçirdi! Çaresiz kukla Murat Beg tahttan indirildi, Atalık Gazi unvanını alan Yakub Beg hanlığın mutlak hükümdarı oldu. Şimdi tek amacımız parçalanmış ülkemizi yeniden birleştirmek."
  hokand_events.2.f:0 "Fergana Vadisi'nin üzerinde yeni bir güneş doğuyor. Yakub Beg'in demir iradesi Türkistan'ı birleştirecek."
  hokand_events.2.a:0 "Çok yaşa Atalık Gazi!"
  hokand_events.3.t:0 "Yedişehir'in Doğuşu"
  hokand_events.3.d:0 "Fergana'da otoriteyi pekiştirip doğu topraklarımızı güvence altına alan Yakub Beg, Doğu Türkistan'ın (Kaşgar) kalbinde yeni ve güçlü bir devlet ilan ediyor: Yedişehir Hanlığı!"
  hokand_events.3.f:0 "Tanrı Dağları'ndan Tarım Havzası'na tek bir bayrak dalgalanıyor."
  hokand_events.3.a:0 "Yedişehir'in şanlı sancakları yükselsin!"
  hokand_events.4.t:0 "Divanımızdaki Entrikalar"
  hokand_events.4.d:0 "Saraydaki hizipler, zayıflayan Han'dan yararlanarak tahtımızdan yeni tavizler ve imtiyazlar koparmaya çalışıyor."
  hokand_events.4.f:0 "Siyaset, savaş meydanından çok daha tehlikeli bir sahadır."
  hokand_events.4.a:0 "Temkinli davranmalıyız."
  hokand_events.5.t:0 "Ordumuzda Yükselen Bir Güç"
  hokand_events.5.d:0 "Subaylarımız ve tebaamız arasındaki prestij dengesi hızla değişiyor."
  hokand_events.5.f:0 "Eski düzen sarsılırken yeni bir yıldız doğuyor."
  hokand_events.5.a:0 "Gelişmeleri yakından izleyelim."
  hokand_events.6.t:0 "Ming Hanedanı'nın Çıkmazı"
  hokand_events.6.d:0 "Komutanımız Yakub Beg saraydaki Buhara işbirlikçilerini tasfiye edemeden ve yeterli destek toplayamadan Han Otoritesi yeniden zirveye ulaştı; beklenen dönüşüm gerçekleşmedi. Yakub Beg gözden düştü ve saraydan uzaklaştırıldı. Kukla Murat Beg tahtta kalsa da hanlığımız artık hiziplerin elinde çürüyen, entrikalarla felç olmuş gerici bir yapıya büründü."
  hokand_events.6.f:0 "Büyük bir kurtuluş fırsatı ellerimizden kayıp gitti. Hokand artık eski ihtişamının acınası bir gölgesinden ibaret..."
  hokand_events.6.a:0 "Karanlık ve durağan bir döneme giriyoruz..."
# --- OTORİTE BOŞLUĞU RASTGELE OLAY SEÇENEK BAR ETKİLERİ ---
  hokand_void_event_court_bars_tt:0 "• Han Otoritesi #G+15#!\n• Özbek ve Askeri Destek (Yakub Beg) #R-10#!"
  hokand_void_event_yakub_bars_tt:0 "• Özbek ve Askeri Destek (Yakub Beg) #G+15#!\n• Han Otoritesi #R-10#!"
  hokand_void_followup_court_bars_tt:0 "• Han Otoritesi #G+6#!\n• Özbek ve Askeri Destek (Yakub Beg) #R-6#!"
  hokand_void_followup_yakub_bars_tt:0 "• Özbek ve Askeri Destek (Yakub Beg) #G+6#!\n• Han Otoritesi #R-6#!"
# --- 10 TARİHSEL SARAY VE DİVAN OLAYI (OTORİTE BOŞLUĞU: 10-19) ---
# .a = Saray / Han Otoritesi yanlısı karar, .b = Yakub Beg / ordu yanlısı karar
  hokand_events.10.t:0 "Taşkent'ten Gelen Vergi Kervanı"
  hokand_events.10.d:0 "Taşkent valisi ve eşrafı bu yılki vergileri başkente göndermeyi reddedip doğrudan Yakub Beg'in ordusuna yönlendirdi! Saray ya vergi otoritesini savunacak ya da bu askeri emrivakiyi kabullenecek."
  hokand_events.10.f:0 "Hazine boşaldıkça ordunun kılıcı parlar."
  hokand_events.10.a:0 "Vergi otoritemizi savunup kervanı başkente geri çağıralım. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.10.b:0 "Ordunun bu emrivakisini kabullenip Yakub Beg'e güvenelim. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.11.t:0 "Kıpçak Aşiretlerinin Muhtırası"
  hokand_events.11.d:0 "Kıpçak savaş ağaları kılıçlarıyla divana dayanarak Yakub Beg'in subaylarının saraydan uzaklaştırılmasını istedi! Ya aşiret imtiyazlarını tanıyıp tahtı tahkim edeceğiz ya da subaylara güveneceğiz."
  hokand_events.11.f:0 "Bozkırın atlıları ile subaylar arasındaki mücadele saraya taştı."
  hokand_events.11.a:0 "Aşiret imtiyazlarını tanıyıp tahtı tahkim edelim. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.11.b:0 "Subaylarımıza güvenip modern orduyu destekleyelim. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.12.t:0 "Buhara Elçisinin Altın Sandıkları"
  hokand_events.12.d:0 "Buhara elçisi saraya altın sunarak Yakub Beg gibi başı buyruk bir komutanın azledilmesini şart koştu. Saray bu altınla tahtını güçlendirebilir ancak ordu bu dış müdahaleyi öfkeyle karşılayacaktır."
  hokand_events.12.f:0 "Düşmanın sunduğu altın kına bulanmış hançerdir."
  hokand_events.12.a:0 "Altını kabul edip tahtımızı güçlendirelim. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.12.b:0 "Bu dış müdahaleyi reddedip orduya güvenelim. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.13.t:0 "Ulemanın Divandaki Vaazı"
  hokand_events.13.d:0 "Geleneksel meşruiyeti savunan saray uleması ile Atalık Gazi'nin cihadını destekleyen reformist şeyhler divanda karşı karşıya geldi! Saray ya kendi ulemasını destekleyecek ya da ordunun manevi üstünlüğünü izleyecek."
  hokand_events.13.f:0 "Minberlerden yükselen sesler safları belirliyor."
  hokand_events.13.a:0 "Kendi ulemamızı destekleyelim. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.13.b:0 "Ordunun manevi üstünlüğüne izin verelim. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.14.t:0 "Akmescit Garnizonunun Maaş Muhtırası"
  hokand_events.14.d:0 "Maaş alamayan sınır askerlerinin isyan eşiğinde olduğunu bildiren Yakub Beg, ya hazineden altın ödenmesini ya da kalenin gümrük gelirlerinin orduya bırakılmasını istiyor."
  hokand_events.14.f:0 "Sınır askerinin sabrı kale duvarından çabuk çatlar."
  hokand_events.14.a:0 "Hazineden askerlerin maaşını derhal ödeyelim. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.14.b:0 "Gümrük gelirlerini orduya bırakalım. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.15.t:0 "Fergana Kervan Yolları Asayişi"
  hokand_events.15.d:0 "Saray muhafızlarının yetersizliğini fırsat bilen Yakub Beg süvari birlikleriyle yollarda kontrolü eline aldı. Tüccarlar artık ticaretin tek koruyucusu olarak komutanı tanıyor."
  hokand_events.15.f:0 "Ticaret damarları kesilen devlet can çekişen gövdeye benzer."
  hokand_events.15.a:0 "Saray muhafızlarını güçlendirip asayişi kendimiz sağlayalım. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.15.b:0 "Yollardaki denetimi Yakub Beg'e bırakalım. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.16.t:0 "Hiva Hanlığı ile Sınır İhtilafı"
  hokand_events.16.d:0 "Hiva Hanlığı atlıları sınır aşiretlerimizi yağmaladığında saray sadece diplomatik nota vermeyi planlarken divan salonunun kapıları gürültüyle açıldı! Yakub Beg ve subayları, sınır namusunun kağıtla korunamayacağını söyleyerek derhal askeri harekât başlatacaklarını bildirdi."
  hokand_events.16.f:0 "Sınır taşından verilen ödün, sarayın kapısından verilen ödündür."
  hokand_events.16.a:0 "Komutanın askeri emrivakisini reddedip egemenliğimizi savunalım. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.16.b:0 "Ordunun fiili müdahalesine izin verelim. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.17.t:0 "Musulmankul'un Saray Üzerindeki Gölgesi"
  hokand_events.17.d:0 "Kıpçakların acımasız savaş ağası Musulmankul, sarayımıza gelerek Murat Beg'e açıkça şantaj yaptı! En büyük rakibi gördüğü Yakub Beg'e sadık genç subayların derhal sürgün edilmesini dayatan Musulmankul, aksi halde bozkır aşiretlerinin başkenti kuşatacağını söyledi."
  hokand_events.17.f:0 "Sarayın direği eğilirse, çatı tüm hanedanın başına çöker."
  hokand_events.17.a:0 "Musulmankul ile uzlaşıp istikrarı koruyalım. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.17.b:0 "Orduya güvenip bu bozkır ağasına meydan okuyalım. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.18.t:0 "Toplayıcı Vali ve Şehirli Tüccarlar"
  hokand_events.18.d:0 "Huçent valimizin gayrimeşru vergiler kesmesi üzerine şehirli tüccarlar ayaklandı. Saray valiyi korumaya çalışırken Yakub Beg araya girdi ve tüccar eşrafını arkasına alarak valinin derhal azledilmesini dayattı."
  hokand_events.18.f:0 "Tebaasını kılıçla soyan vali, hanın tahtını oyuyordur."
  hokand_events.18.a:0 "Valimize sahip çıkıp vergi otoritemizi koruyalım. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.18.b:0 "Ordunun ve tüccarların fiili müdahalesini kabul edelim. (Yakub Destek +15, Han Otoritesi -10)"
  hokand_events.19.t:0 "Kraliyet Cephaneliğinde Taktik Reform"
  hokand_events.19.d:0 "Yakub Beg ve reformist genç subayları, saray muhafızlarının elindeki köhne cephaneliğe ve topçu dökümhanelerine fiilen el koymak üzere divana bir muhtıra sundu. Saray ya bu askeri müdahaleyi reddedip muhafızların yetkisini koruyacak ya da modern ordunun cephanelikleri kontrol altına almasını izleyecektir."
  hokand_events.19.f:0 "Yeniliğe kapısını kapatan kale, düşmanın girmesini bekliyordur."
  hokand_events.19.a:0 "Muhafızların cephanelik yetkisini koruyalım. (Han Otoritesi +15, Yakub Destek -10)"
  hokand_events.19.b:0 "Modern ordunun cephanelikleri devralmasına izin verelim. (Yakub Destek +15, Han Otoritesi -10)"
# --- ZİNCİRLEME TAKİP OLAYLARI (20-22) ---
  hokand_events.20.t:0 "Taşkent Valisinin İsyan Tehdidi"
  hokand_events.20.d:0 "Taşkent vergi gelirlerinin garnizonlara yönlendirilmesine öfkelenen vali, geleneksel soyluları arkasına alarak tahıl ve vergi kervanlarını durdurmakla tehdit ediyor! Saray ya valiyi derhal görevden alarak otoritesini sergileyecek yahut ordunun subaylarının bu isyanı fiilen bastırmasına izin verecektir."
  hokand_events.20.f:0 "Siyasetin ektiği rüzgâr, aylar sonra fırtına olarak saraya döner."
  hokand_events.20.a:0 "Valiyi görevden alın; sarayın otoritesine başkaldıran kimseye müsamaha gösterilmeyecek! (Han Otoritesi +6, Yakub Destek -6)"
  hokand_events.20.b:0 "Yakub Beg'in subayları valinin isyan tehdidini bastırıp gelirleri güvenceye aldı! (Yakub Destek +6, Han Otoritesi -6)"
  hokand_events.21.t:0 "Musulmankul'un Kıpçak Atlıları Yolları Kesti!"
  hokand_events.21.d:0 "İmtiyazlarının reddedilmesine öfkelenen Kıpçak savaş ağası Musulmankul, binlerce atlısıyla Huçent yollarını kesti ve Yakub Beg'in yetkilerinin alınmasını talep etti! Saray ya aşiretlerle diplomasiye oturup otoritesini savunacak yahut Atalık Gazi'nin süvarilerinin ablukayı zorla dağıtmasını izleyecektir."
  hokand_events.21.f:0 "Bozkırın atlıları kılıçlarını çektiğinde Fergana Vadisi'nde sessizlik başlar."
  hokand_events.21.a:0 "Aşiretlerle müzakereye oturun; Hanlık otoritesini diplomasiyle koruyalım! (Han Otoritesi +6, Yakub Destek -6)"
  hokand_events.21.b:0 "Atalık Gazi'nin süvarileri Kıpçak ablukasını yararak yolları açtı; aşiretler geri çekildi! (Yakub Destek +6, Han Otoritesi -6)"
  hokand_events.22.t:0 "Akmescit Kalesinde Bağımsız Garnizon Nüfuzu"
  hokand_events.22.d:0 "Kalenin gümrük gelirlerini denetim altına alan Yakub Beg, Akmescit'i askeri bir üsse dönüştürdü ve subaylar sadece Atalık Gazi'ye selam duruyor! Saray ya garnizona mali müfettişler göndererek denetimi kuracak ya da garnizonun bu fiili özerkliğini kabullenecektir."
  hokand_events.22.f:0 "Sınırda büyüyen aslan, gün gelir sarayın kapısını çalar."
  hokand_events.22.a:0 "Garnizona özel müfettişler gönderin; gümrük gelirleri sarayın denetiminde olmalıdır! (Han Otoritesi +6, Yakub Destek -6)"
  hokand_events.22.b:0 "Akmescit garnizonu sarayın mali denetimini kesin bir dille reddetti! (Yakub Destek +6, Han Otoritesi -6)"
# --- YAKUB BEG OTORİTESİNİ TESİS EDİYOR — AÇILIŞ OLAYI (35) ---
  hokand_events.35.t:0 "Atalik Gazi'nin İlk Fermanları"
  hokand_events.35.d:0 "Atalik Gazi olarak hükmeden Yakub Beg, Hokand sarayından ilk fermanlarını çıkarır; subaylarının rütbelerini onaylar ve yeni yönetimini sağlamlaştırmak için Taşkent tüccar soylularını yanına çeker."
  hokand_events.35.f:0 "Askerin tahtı da, herhangi bir hanedanlık kadar dikkatle kurulmalıdır."
  hokand_events.35.a:0 "Yeni iktidarımızın ilk fermanlarını çıkaralım."
# --- OTORİTENİN TESİSİ RASTGELE OLAY SEÇENEK BAR ETKİLERİ ---
  hokand_secure_event_fergana_bars_tt:0 "• Fergana Otoritesi #G+15#!"
  hokand_secure_event_nomad_bars_tt:0 "• Göçebe Aşiret Desteği #G+15#!"
# --- OTORİTENİN TESİS EDİLMESİ (2. AŞAMA) RASTGELE OLAYLAR (40-49) ---
# .a = Fergana Otoritesi yanlısı karar, .b = Göçebe Aşiret Desteği yanlısı karar
  hokand_events.40.t:0 "Taşkent Vergisinin Düzenlenmesi"
  hokand_events.40.d:0 "Taşkent garnizonunun vergi gelirlerini doğrudan kendi hazinesine aktarma girişimi divanda tartışmaya açıldı. Ya bu geliri merkezi hazineye bağlarız ya da garnizonun ve civar halkın isteklerine göz yumarız."
  hokand_events.40.f:0 "Hazineye giden her akçe, Fergana'nın kime ait olduğunu gösterir."
  hokand_events.40.a:0 "Vergi tahsilatını doğrudan sarayın denetimine bağlayalım. (Fergana Otoritesi +15)"
  hokand_events.40.b:0 "Garnizonun ve yerel halkın taleplerine bir miktar taviz verelim. (Göçebe Aşiret Desteği +15)"
  hokand_events.41.t:0 "Kıpçak Aşiret Reisleri ve Atlı Birlikler"
  hokand_events.41.d:0 "Kıpçak beyleri, ellerindeki vergi toplama imtiyazlarının bir yıl daha uzatılmasını istiyor; aksi halde atlı birliklerini geri çekmekle tehdit ediyorlar."
  hokand_events.41.f:0 "Bozkırın atlıları, sadakatini her zaman bir bedel karşılığında sunar."
  hokand_events.41.a:0 "Beylerin imtiyazını uzatıp aşiret atlılarını yanımızda tutalım. (Göçebe Aşiret Desteği +15)"
  hokand_events.41.b:0 "Vergi toplama yetkisini merkezden atanan tahsildarlara devredelim. (Fergana Otoritesi +15)"
  hokand_events.42.t:0 "Buhara Elçiliği ile Saray Diplomasisi"
  hokand_events.42.d:0 "Buhara Emirliği'nden gelen elçi, sınır ticaretinde imtiyaz karşılığında aracılık teklif ediyor; ancak bu teklif hem sarayın vergi otoritesini hem de göçebe aşiretlerle ilişkilerimizi etkileyecek."
  hokand_events.42.f:0 "Elçinin tebessümünün ardında hep bir hesap gizlidir."
  hokand_events.42.a:0 "Teklifi reddedip Fergana'daki vergi denetimini doğrudan sarayın eline alalım. (Fergana Otoritesi +15)"
  hokand_events.42.b:0 "Elçinin arabuluculuğunu kabul edip sınırdaki göçebe aşiretlerle ateşkes sağlayalım. (Göçebe Aşiret Desteği +15)"
  hokand_events.43.t:0 "Ulemanın Cihat Çağrısı ve Nakşibendi Vakıfları"
  hokand_events.43.d:0 "Nakşibendi vakıfları pamuk ve tahıl üreten köylülere destek sağlamak isterken bazı ulema bu desteğin devlet ambarlarına yönlendirilmesini talep ediyor."
  hokand_events.43.f:0 "Toprağın bereketi, kimin cebine gireceğiyle ölçülür."
  hokand_events.43.a:0 "Çiftçilere tarım kredisi ve vergi affı sağlayalım. (Fergana Otoritesi +15)"
  hokand_events.43.b:0 "Üretim kotası koyup fazlasını devlet ambarlarında toplayalım. (Göçebe Aşiret Desteği +15)"
  hokand_events.44.t:0 "Akmescit Garnizonu ve Subay Teçhizatları"
  hokand_events.44.d:0 "Akmescit garnizonundaki subaylar yeni teçhizat talep ederken, İpek Yolu tüccarları kervansaray vergilerinin düşürülmesini bekliyor."
  hokand_events.44.f:0 "Sınırın güvenliği, kimin lehine yorumlanırsa ona hizmet eder."
  hokand_events.44.a:0 "Kervansaray vergilerini düşürüp tüccarları şehre çekelim. (Fergana Otoritesi +15)"
  hokand_events.44.b:0 "Sınır gümrüklerini sıkılaştırıp kaçakçılığa göz açtırmayalım. (Göçebe Aşiret Desteği +15)"
  hokand_events.45.t:0 "İpek Yolu Kervan Korunması ve Gümrükler"
  hokand_events.45.d:0 "Medrese hocaları maaş zammı isterken, teknik ve askeri eğitim veren yeni saray sınıfları açılması yönünde baskı da artıyor."
  hokand_events.45.f:0 "Bilgi de, sadakat gibi, sabırla ekilen bir tohumdur."
  hokand_events.45.a:0 "Medrese hocalarının maaşlarını artırıp bağlılıklarını pekiştirelim. (Fergana Otoritesi +15)"
  hokand_events.45.b:0 "Teknik ve askeri eğitim veren modern sınıflar açalım. (Göçebe Aşiret Desteği +15)"
  hokand_events.46.t:0 "Hive Hanlığı Sınırı ve Kızılkum Karakolları"
  hokand_events.46.d:0 "Yaylak ve kışlak yollarında göçebelerin geçiş güvenliği tartışılırken, hazine bu yollardan düzenli vergi almanın yollarını arıyor."
  hokand_events.46.f:0 "Kızılkum'un kumu geçen her kervanın izini siler ama borcunu unutmaz."
  hokand_events.46.a:0 "Yaylak yollarında göçebelere askeri koruma sağlayalım. (Fergana Otoritesi +15)"
  hokand_events.46.b:0 "Yaylak geçişlerinden düzenli hayvan vergisi ve otlak harcı alalım. (Göçebe Aşiret Desteği +15)"
  hokand_events.47.t:0 "Musulmankul'un Saray Nüfuzu ve Aşiretler"
  hokand_events.47.d:0 "Zanaatkarlar atölyelerini genişletmek için hazineden destek isterken, ordu cephaneliği için doğrudan usta istihdamı öneriliyor."
  hokand_events.47.f:0 "Çekiç sesi, bazen kılıç şakırtısından daha çok şey anlatır."
  hokand_events.47.a:0 "Zanaatkarların atölyelerine hazineden destek verelim. (Fergana Otoritesi +15)"
  hokand_events.47.b:0 "Silah ve demir ustalarını doğrudan cephanelik için çalıştıralım. (Göçebe Aşiret Desteği +15)"
  hokand_events.48.t:0 "Toplayıcı Valilerin Denetimi ve Şehirli Tüccarlar"
  hokand_events.48.d:0 "Vergi toplayan valilerin denetimini sıkılaştırmak mı, yoksa aşiret tüccarlarına ve pazar yerlerine kolaylık tanımak mı gerektiği divanda tartışılıyor."
  hokand_events.48.f:0 "Pazarın gürültüsü, sarayın sessizliğinden daha dürüst konuşur."
  hokand_events.48.a:0 "Vergi toplayan valilerin denetimini sıkılaştıralım. (Fergana Otoritesi +15)"
  hokand_events.48.b:0 "Aşiret tüccarlarına ve pazar yerlerine vergi kolaylığı sağlayalım. (Göçebe Aşiret Desteği +15)"
  hokand_events.49.t:0 "Saray Cephaneliği ve Top Dökümhaneleri Modernizasyonu"
  hokand_events.49.d:0 "Saray muhafızlarının talim düzeni ve maaş ödemeleri gündemdeyken, garnizon komutanlıklarına yerel aşiret kökenli subayların atanması da öneriliyor."
  hokand_events.49.f:0 "Disiplin, ancak zamanında ödenen maaşla anlam kazanır."
  hokand_events.49.a:0 "Muhafızların talimini sıkılaştırıp maaşlarını zamanında ödeyelim. (Fergana Otoritesi +15)"
  hokand_events.49.b:0 "Garnizon komutanlıklarına yerel aşiret kökenli subaylar atayalım. (Göçebe Aşiret Desteği +15)"
# --- OTORİTENİN TESİS EDİLMESİ (2. AŞAMA) BUTON OLAYLARI (50-55) ---
  hokand_events.50.t:0 "Fergana Beylerini İtaate Alma"
  hokand_events.50.d:0 "Hazine altını çoktan harcanmış; Fergana beyleri divanın önünde hükmü bekliyor. Sarayın yeni otoritesini ne kadar sert dayatacağımız, yıllarca sürecek sadakatlerini belirleyecek."
  hokand_events.50.f:0 "Altın kapıyı açar; gerisini irade belirler."
  hokand_events.50.a:0 "Beylerin kalan imtiyazlarını kökünden kaldıralım."
  hokand_events.50.b:0 "Ünvanlarını açık sadakat karşılığında onaylayalım."
  hokand_events.51.t:0 "Fergana Ulemasının Şer'i Onayı"
  hokand_events.51.d:0 "Fergana'nın Nakşibendi uleması, saray otoritesine dini onay sunuyor; fakat talep ettikleri bedel, sarayın ne kadar eğileceğine göre keskin biçimde değişiyor."
  hokand_events.51.f:0 "Bir fetva, yüz askerden daha ağır basar."
  hokand_events.51.a:0 "Şer'i mahkemeleri ulemanın itirazına rağmen dayatalım."
  hokand_events.51.b:0 "Hayır duası karşılığında medreselerini vakfedelim."
  hokand_events.52.t:0 "Alimbek Datka ile Antlaşma"
  hokand_events.52.d:0 "Kırgız ve Kıpçak boylarının reisi Alimbek Datka, savaşçılarını tahta bağlamayı teklif ediyor. Tam ittifak hazineyi ağır yükler; daha hafif bir antlaşma ise çok daha az bağlılık getirir."
  hokand_events.52.f:0 "Bir bozkır reisinin sözü, tam olarak ödenen bedel kadar değerlidir."
  hokand_events.52.a:0 "Kalıcı sadakat için Alimbek'in istediği bedeli ödeyelim."
  hokand_events.52.b:0 "Mütevazı bir antlaşma ve daha az bağlılık kabul edelim."
  hokand_events.53.t:0 "Sınır Süvarilerini Seferber Etmek"
  hokand_events.53.d:0 "Göçebe atlılar, sınırdaki akıncılara karşı sert harekâta hazır. Agresif bir sefer aşiretlerin derin minnetini kazanır; ama arkadaki yerleşik vadileri de huzursuz eder."
  hokand_events.53.f:0 "Nallar, bastırdığından daha çok toz kaldırır."
  hokand_events.53.a:0 "Süvarileri akıncılara karşı derhal serbest bırakalım."
  hokand_events.53.b:0 "Süvarileri yalnızca sınır hattında konuşlandıralım."
  hokand_events.54.t:0 "Fergana Dağlarındaki İsyan Kampları"
  hokand_events.54.d:0 "Asi aşiretler, vadi dışındaki dağ kamplarında toplanmış. Onları ezmek korku ve bağlılık kazandırır; altınla dağıtmak ise daha sessiz bir barış alır."
  hokand_events.54.f:0 "Dağlar bu işlerde kendi kararını saklar."
  hokand_events.54.a:0 "Kampları basıp asileri kökünden ezelim."
  hokand_events.54.b:0 "Asileri sessizce dağılmaları için satın alalım."
  hokand_events.55.t:0 "Sınır Devriyelerini Güçlendirmek"
  hokand_events.55.d:0 "Alimbek'in aşiret atlıları ile Fergana garnizonları sınırı birlikte bekleyebilir; fakat bir yıllık tam devriye, daha kısa bir görevden çok daha pahalıya mal olur."
  hokand_events.55.f:0 "Gözetilen sınır, açık sınırdan daha rahat uyur."
  hokand_events.55.a:0 "Bir yıllık ortak sınır devriyesini finanse edelim."
  hokand_events.55.b:0 "Daha kısa bir sınır devriyesi sezonunu finanse edelim."
