  establish_yettishar_pu:0 "Yedişehir'i (Kaşgar) Kur"
  establish_yettishar_pu_desc:0 "Savaş veya kriz sonucu ele geçirdiğimiz Kaşgar bölgesinde Yakub Beg'in yönetiminde özerk bir devlet kur (Personal Union)."
  persuade_turkmenistan:0 "Türkmenistan'ı Himaye Altına Al"
  persuade_turkmenistan_desc:0 "Prestijimiz ve gücümüzle Türkmen boylarını savaşsız bir şekilde ikna edip bize bağlanmalarını (Personal Union) sağla."
  annex_bukhara_diplomatically:0 "Buhara'yı Entegre Et"
  annex_bukhara_diplomatically_desc:0 "Buhara Emirliğini diplomatik yollarla ilhak et ve Özbekleri ana kültürümüze kat."
  annex_khiva_diplomatically:0 "Hive'yi Entegre Et"
  annex_khiva_diplomatically_desc:0 "Hive Hanlığını ikna yoluyla ilhak et."
  annex_kazakh_zhuz:0 "Kazak Cüzlerini Birleştir"
  kashgar_diplomacy_events.12.f:0 "Asya pazarlarının kapıları aralanıyor..."
  kashgar_diplomacy_events.1301.t:0 "Kaşgar'dan Gelen Tarafsızlık Teklifi"
  kashgar_diplomacy_events.1301.d:0 "Yedişehir elçileri St. Petersburg'a gelerek Çin ile yaşanacak savaşta Rus İmparatorluğu'nun tarafsız kalmasını talep ediyorlar."
  kashgar_diplomacy_events.1301.f:0 "Güney sınırlarımızdaki sükûnet bizim için değerlidir."
  kashgar_diplomacy_events.1301.a:0 "Tarafsızlık taahhüdünü ve sınır garantilerini kabul ediyoruz."
  kashgar_diplomacy_events.1301.b:0 "Çarlık diplomasisinin elini kolunu bağlayacak hiçbir taahhüdü kabul edemeyiz."
  kashgar_diplomacy_events.1302.t:0 "Kaşgar'dan Gelen Askeri Destek ve Toprak Teklifi"
  kashgar_diplomacy_events.1302.d:0 "Yedişehir elçileri St. Petersburg'a cazip bir teklifle geldiler: Çin'e karşı ortak harekat ve askeri destek."
  kashgar_diplomacy_events.1302.f:0 "Doğuda yeni topraklar kazanmak için tarihi bir fırsat."
  kashgar_diplomacy_events.1302.a:0 "Mançurya toprakları karşılığında bu askeri desteği derhal kabul ediyoruz!"
  kashgar_diplomacy_events.1302.b:0 "Askeri kuvvetlerimizi Çin seddine sürmek risklidir."
# ── YEDİŞEHİR BİLGİLENDİRME EVENTLERİ (14, 15) ──────────────────────────────
  kashgar_diplomacy_events.14.t:0 "Diplomatik Destek Kararı: Kabul Edildi"
  kashgar_diplomacy_events.14.d:0 "Gönderdiğimiz elçiler başarıyla döndü! Büyük güçler özgürlük mücadelemizde yanımızda durmayı kabul ettiler."
  kashgar_diplomacy_events.14.f:0 "Müttefiklerimizin orduları sınırlarımıza yaklaşıyor."
  kashgar_diplomacy_events.14.a:0 "Yaşasın özgür Doğu Türkistan!"
  kashgar_diplomacy_events.15.t:0 "Diplomatik Destek Kararı: Reddedildi"
  kashgar_diplomacy_events.15.d:0 "Gönderdiğimiz elçiler eli boş döndü. Talep ettiğimiz destek teklifi saray amirleri tarafından geri çevrildi."
  kashgar_diplomacy_events.15.f:0 "Kendi gücümüze güvenmekten başka çaremiz kalmadı."
  kashgar_diplomacy_events.15.a:0 "Mücadelemizden asla vazgeçmeyeceğiz!"
